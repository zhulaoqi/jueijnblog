<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>从个人交付到认知经营的四层状态</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font-family:'Geist','PingFang SC','Noto Sans CJK SC',sans-serif}
    svg{display:block;width:1280px;height:720px}
    .name{font:600 16px 'Geist','PingFang SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.08em}
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">从个人交付到认知经营的四层状态</title>
  <desc id="layers-desc">职业状态自下而上分为个人交付、局部放大、系统赋能和认知经营。多数技术骨干卡在局部放大，判断仍留在个人头脑里。</desc>
  <rect width="1280" height="720" fill="#f5f5f5"/>

  <text x="40" y="44" class="mono">LAYER STACK · CAREER STATE</text>
  <text x="40" y="80" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">用“你不在还转不转”看自己在哪一层</text>
  <text x="40" y="108" class="note">职级称呼不准。看判断有没有离开你的脑子，事能不能按标准继续发生。</text>

  <text x="56" y="360" class="mono" fill="#4f5d75" transform="rotate(-90 56 360)">LEVERAGE</text>
  <polygon points="72,168 80,156 88,168" fill="#4f5d75"/>
  <line x1="80" y1="168" x2="80" y2="560" stroke="#4f5d75" stroke-width="1"/>

  <rect x="160" y="148" width="1080" height="64" rx="4" fill="#fff" stroke="#2d3142"/>
  <text x="184" y="176" class="mono">L4</text>
  <text x="240" y="188" class="name">认知经营</text>
  <text x="1208" y="188" class="mono" text-anchor="end">DECIDE WHAT NOT TO DO · SHAPE RESOURCES</text>

  <rect x="160" y="212" width="1080" height="64" rx="4" fill="#fff" stroke="rgba(45,49,66,.16)"/>
  <text x="184" y="240" class="mono">L3</text>
  <text x="240" y="252" class="name">系统赋能</text>
  <text x="1208" y="252" class="mono" text-anchor="end">STANDARD RUNS WITHOUT YOU</text>

  <rect x="160" y="276" width="1080" height="72" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="184" y="308" class="mono" fill="#eb6c36">L2</text>
  <text x="240" y="320" class="name" fill="#eb6c36">局部放大</text>
  <text x="1208" y="320" class="mono" text-anchor="end" fill="#eb6c36">CAN LEAD · JUDGMENT STILL IN YOUR HEAD</text>

  <rect x="160" y="348" width="1080" height="64" rx="4" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.16)"/>
  <text x="184" y="376" class="mono">L1</text>
  <text x="240" y="388" class="name">个人交付</text>
  <text x="1208" y="388" class="mono" text-anchor="end">IF YOU LEAVE · THE WORK STOPS</text>

  <rect x="160" y="456" width="1080" height="120" rx="8" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.16)"/>
  <text x="184" y="492" class="name">怎么对号</text>
  <text x="184" y="524" class="note">L1 你是唯一能做完的人。L2 别人能做，最后一笔仍是你。L3 标准能离开你运转。L4 你在决定做不做，不再接回所有难事。</text>
  <text x="184" y="552" class="mono">MOST PEOPLE FREEZE AT L2 · MANAGEMENT BEGINS WHEN L3 HOLDS</text>

  <rect x="160" y="600" width="1080" height="76" rx="8" fill="rgba(235,108,54,.04)" stroke="rgba(235,108,54,.36)" stroke-dasharray="4,4"/>
  <text x="184" y="636" class="name">走向管理的关口</text>
  <text x="184" y="660" class="note">过关不是拿到经理头衔，是从 L1 / L2 走到 L3。编制决定你走组织管理还是专业杠杆，不决定你能不能过这一关。</text>
</svg>
</body>
</html>
