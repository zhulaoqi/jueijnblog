<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理价值模型怎么走通</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font-family:'Geist','PingFang SC','Noto Sans CJK SC',sans-serif}
    svg{display:block;width:1280px;height:720px}
    .name{font:600 12px 'Geist','PingFang SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.06em}
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="path-title path-desc">
  <title id="path-title">管理价值模型怎么走通</title>
  <desc id="path-desc">从判断外化、少接重复难事、复制判断到选择系统题目，再按现实走专业杠杆或组织管理两条出路。AI 只作为把判断做成可复用能力的手段。</desc>
  <defs>
    <marker id="path-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="path-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="path-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>

  <text x="40" y="44" class="mono">ARCHITECTURE · VALUE MODEL PATH</text>
  <text x="40" y="80" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">先让判断离开你，再选两条出路</text>
  <text x="40" y="108" class="note">一层一层过。个人交付还没外化，就谈管人和平台，多半会虚。</text>

  <rect x="40" y="148" width="1200" height="200" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
  <rect x="56" y="140" width="96" height="16" rx="2" fill="#f5f5f5"/>
  <text x="104" y="152" class="mono" text-anchor="middle">ONE PATH</text>

  <line x1="216" y1="248" x2="248" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#path-arrow)"/>
  <line x1="448" y1="248" x2="480" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#path-arrow)"/>
  <line x1="680" y1="248" x2="712" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#path-arrow)"/>
  <line x1="912" y1="248" x2="944" y2="248" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#path-accent)"/>
  <path d="M1020 296 V348 H340 V400" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#path-link)"/>
  <path d="M1068 296 V364 H976 V400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#path-arrow)"/>

  <rect x="64" y="200" width="152" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="140" y="240" class="name" text-anchor="middle">判断外化</text>
  <text x="140" y="268" class="mono" text-anchor="middle">WRITE WHAT GOOD IS</text>

  <rect x="248" y="200" width="200" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="348" y="240" class="name" text-anchor="middle">少接重复难事</text>
  <text x="348" y="268" class="mono" text-anchor="middle">STOP FEEDING THE TRAP</text>

  <rect x="480" y="200" width="200" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="580" y="240" class="name" text-anchor="middle">复制判断</text>
  <text x="580" y="268" class="mono" text-anchor="middle">REVIEW TRAINS OTHERS</text>

  <rect x="712" y="200" width="200" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="812" y="240" class="name" text-anchor="middle">选系统题目</text>
  <text x="812" y="268" class="mono" text-anchor="middle">MULTI-PERSON PAYOFF</text>

  <rect x="944" y="200" width="200" height="96" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="1044" y="240" class="name" text-anchor="middle">系统赋能站住</text>
  <text x="1044" y="268" class="mono" text-anchor="middle">WORK RUNS WITHOUT YOU</text>

  <rect x="40" y="400" width="600" height="96" rx="6" fill="rgba(46,90,168,.06)" stroke="#2e5aa8"/>
  <text x="340" y="440" class="name" text-anchor="middle">专业杠杆</text>
  <text x="340" y="468" class="mono" text-anchor="middle">STANDARD · PLATFORM · CROSS-TEAM</text>

  <rect x="712" y="400" width="528" height="96" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
  <text x="976" y="440" class="name" text-anchor="middle">组织管理</text>
  <text x="976" y="468" class="mono" text-anchor="middle">TRUST FIRST · THEN HEADCOUNT</text>

  <rect x="40" y="528" width="1200" height="148" rx="8" fill="rgba(235,108,54,.04)" stroke="rgba(235,108,54,.36)" stroke-dasharray="4,4"/>
  <text x="64" y="568" class="name">价值模型</text>
  <text x="160" y="568" class="note">正确的事持续发生，不必经过你的手。编制决定走哪条出路，不决定要不要先走到系统赋能。</text>
  <text x="64" y="600" class="name">AI 放哪</text>
  <text x="160" y="600" class="note">只加快自己，模型没换。把验收、清单、工作流嵌进团队，才算搬运产能。高风险动作人必须在环里。</text>
  <text x="64" y="640" class="mono">EXTERNALIZE · HAND OFF · MULTIPLY JUDGMENT · THEN CHOOSE LEVERAGE OR ORG MANAGEMENT</text>
</svg>
</body>
</html>
