<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>能干的人如何把自己做成瓶颈</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font-family:'Geist','PingFang SC','Noto Sans CJK SC',sans-serif}
    svg{display:block;width:1280px;height:720px}
    .name{font:600 12px 'Geist','PingFang SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.06em}
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trap-title trap-desc">
  <title id="trap-title">能干的人如何把自己做成瓶颈</title>
  <desc id="trap-desc">组织难事汇入同一个能干活的人，他交付后信誉上升，更多难事再汇回来，判断无法交接，个人交付模型把人钉成单点。</desc>
  <defs>
    <marker id="trap-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="trap-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>

  <text x="40" y="44" class="mono">ARCHITECTURE · PERSONAL DELIVERY TRAP</text>
  <text x="40" y="80" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">越能干，越被做成单点</text>
  <text x="40" y="108" class="note">难事汇入、自己扛完、信誉绑定，再把更多难事送回来。系统没有留下判断，只留下对你的依赖。</text>

  <rect x="40" y="148" width="240" height="424" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
  <rect x="56" y="140" width="88" height="16" rx="2" fill="#f5f5f5"/>
  <text x="100" y="152" class="mono" text-anchor="middle">INBOX</text>

  <rect x="320" y="148" width="640" height="424" rx="8" fill="rgba(235,108,54,.03)" stroke="rgba(235,108,54,.32)" stroke-dasharray="4,4"/>
  <rect x="336" y="140" width="120" height="16" rx="2" fill="#f5f5f5"/>
  <text x="396" y="152" class="mono" text-anchor="middle">YOU AS ENGINE</text>

  <rect x="1000" y="148" width="240" height="424" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
  <rect x="1016" y="140" width="88" height="16" rx="2" fill="#f5f5f5"/>
  <text x="1060" y="152" class="mono" text-anchor="middle">RESULT</text>

  <path d="M256 248 H320 Q328 248 328 256 V304 Q328 312 336 312 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trap-arrow)"/>
  <line x1="256" y1="360" x2="400" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trap-arrow)"/>
  <path d="M256 472 H320 Q328 472 328 464 V416 Q328 408 336 408 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trap-arrow)"/>
  <line x1="600" y1="360" x2="680" y2="360" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#trap-accent)"/>
  <line x1="880" y1="280" x2="1040" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trap-arrow)"/>
  <line x1="880" y1="440" x2="1040" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trap-arrow)"/>
  <path d="M1120 488 V520 H240 V208" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#trap-accent)"/>

  <rect x="720" y="512" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="764" y="522" class="mono" text-anchor="middle" fill="#eb6c36">MORE WORK RETURNS</text>

  <rect x="64" y="208" width="192" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="160" y="240" class="name" text-anchor="middle">紧急故障</text>
  <text x="160" y="264" class="mono" text-anchor="middle">NO OWNER EXCEPT YOU</text>

  <rect x="64" y="320" width="192" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="160" y="352" class="name" text-anchor="middle">跨组难题</text>
  <text x="160" y="376" class="mono" text-anchor="middle">UNWRITTEN JUDGMENT</text>

  <rect x="64" y="432" width="192" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="160" y="464" class="name" text-anchor="middle">关键评审</text>
  <text x="160" y="488" class="mono" text-anchor="middle">FINAL CALL STAYS HERE</text>

  <rect x="400" y="280" width="200" height="160" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="500" y="336" class="name" text-anchor="middle">你把事做完</text>
  <text x="500" y="364" class="mono" text-anchor="middle">DELIVER · FIX · DECIDE</text>
  <text x="500" y="388" class="mono" text-anchor="middle">JUDGMENT STAYS IN HEAD</text>
  <text x="500" y="412" class="mono" text-anchor="middle">TEAM WAITS</text>

  <rect x="680" y="280" width="200" height="160" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="780" y="336" class="name" text-anchor="middle">信誉绑定到你</text>
  <text x="780" y="364" class="mono" text-anchor="middle">TRUST = YOU DID IT</text>
  <text x="780" y="388" class="mono" text-anchor="middle">NOT THE SYSTEM</text>
  <text x="780" y="412" class="mono" text-anchor="middle">HARD TO HANDOFF</text>

  <rect x="1040" y="240" width="160" height="80" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
  <text x="1120" y="272" class="name" text-anchor="middle">一次结果</text>
  <text x="1120" y="296" class="mono" text-anchor="middle">NO REUSABLE STANDARD</text>

  <rect x="1040" y="400" width="160" height="80" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
  <text x="1120" y="432" class="name" text-anchor="middle">单点依赖</text>
  <text x="1120" y="456" class="mono" text-anchor="middle">YOU ARE THE BOTTLENECK</text>

  <rect x="40" y="596" width="1200" height="80" rx="8" fill="rgba(235,108,54,.04)" stroke="rgba(235,108,54,.36)" stroke-dasharray="4,4"/>
  <text x="64" y="632" class="name">封顶原因</text>
  <text x="160" y="632" class="note">组织得到的是你的工时，不是可交接的判断。忙证明不了可托付。</text>
  <text x="64" y="656" class="mono">MORE DELIVERY STRENGTHENS THE TRAP · MANAGEMENT STARTS WHEN JUDGMENT LEAVES YOUR HEAD</text>
</svg>
</body>
</html>
