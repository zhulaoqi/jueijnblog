<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>私有适配与 MCP 标准连接对比</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font:400 16px/1.4 'Geist','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif}
    svg{display:block;width:1280px;height:720px}
    .name{font:600 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.08em}
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="00-private-adapters-vs-mcp-title 00-private-adapters-vs-mcp-desc">
  <title id="00-private-adapters-vs-mcp-title">私有适配与 MCP 标准连接对比</title>
  <desc id="00-private-adapters-vs-mcp-desc">没有 MCP 时，两个 AI 应用分别为 GitLab 和数据库维护四条私有适配；采用 MCP 后，应用通过 Client 与 Server 之间的统一协议连接外部系统。</desc>
  <defs>
    <marker id="adapter-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="adapter-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="adapter-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>

  <text x="40" y="44" class="mono">ARCHITECTURE · BEFORE / AFTER</text>
  <text x="40" y="80" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">MCP 把重复私有适配收敛为标准协议边界</text>
  <text x="40" y="108" class="note">标准化的是能力发现与调用方式，而不是抹平 GitLab、数据库和文件系统的业务差异。</text>

  <rect x="40" y="152" width="520" height="448" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
  <rect x="56" y="144" width="104" height="16" rx="2" fill="#f5f5f5"/>
  <text x="108" y="156" class="mono" text-anchor="middle">WITHOUT MCP</text>

  <rect x="600" y="152" width="640" height="448" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
  <rect x="616" y="144" width="88" height="16" rx="2" fill="#f5f5f5"/>
  <text x="660" y="156" class="mono" text-anchor="middle">WITH MCP</text>

  <line x1="216" y1="260" x2="432" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#adapter-arrow)"/>
  <rect x="280" y="236" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="324" y="245" class="mono" text-anchor="middle">私有适配 01</text>

  <path d="M168 296 V328 Q168 336 176 336 H496 Q504 336 504 344 V400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#adapter-arrow)"/>
  <rect x="292" y="312" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="336" y="321" class="mono" text-anchor="middle">私有适配 02</text>

  <path d="M168 400 V376 Q168 368 176 368 H496 Q504 368 504 360 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#adapter-arrow)"/>
  <rect x="292" y="344" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="336" y="353" class="mono" text-anchor="middle">私有适配 03</text>

  <line x1="216" y1="436" x2="432" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#adapter-arrow)"/>
  <rect x="280" y="412" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="324" y="421" class="mono" text-anchor="middle">私有适配 04</text>

  <path d="M736 260 H744 Q752 260 752 268 V324 Q752 332 760 332 H776" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#adapter-arrow)"/>
  <rect x="688" y="304" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="712" y="313" class="mono" text-anchor="middle">接入</text>

  <path d="M736 436 H744 Q752 436 752 428 V376 Q752 368 760 368 H776" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#adapter-arrow)"/>
  <rect x="688" y="376" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="712" y="385" class="mono" text-anchor="middle">接入</text>

  <line x1="904" y1="348" x2="944" y2="348" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#adapter-arrow-accent)"/>
  <rect x="912" y="320" width="24" height="12" rx="2" fill="#f5f5f5"/>
  <text x="924" y="329" class="mono" text-anchor="middle">MCP</text>

  <line x1="1072" y1="348" x2="1112" y2="348" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#adapter-arrow-link)"/>
  <rect x="1080" y="320" width="24" height="12" rx="2" fill="#f5f5f5"/>
  <text x="1092" y="329" class="mono" text-anchor="middle">API</text>

  <rect x="72" y="224" width="144" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
  <rect x="88" y="236" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.40)" stroke-width=".8"/>
  <text x="100" y="245" class="mono" text-anchor="middle">APP</text>
  <text x="144" y="268" class="name" text-anchor="middle">AI 应用 A</text>

  <rect x="72" y="400" width="144" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
  <rect x="88" y="412" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.40)" stroke-width=".8"/>
  <text x="100" y="421" class="mono" text-anchor="middle">APP</text>
  <text x="144" y="444" class="name" text-anchor="middle">AI 应用 B</text>

  <rect x="432" y="224" width="144" height="72" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
  <rect x="448" y="236" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,.50)" stroke-width=".8"/>
  <text x="464" y="245" class="mono" text-anchor="middle">SAAS</text>
  <text x="504" y="268" class="name" text-anchor="middle">GitLab</text>

  <rect x="432" y="400" width="144" height="72" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
  <rect x="448" y="412" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,.50)" stroke-width=".8"/>
  <text x="460" y="421" class="mono" text-anchor="middle">DB</text>
  <text x="504" y="444" class="name" text-anchor="middle">数据库</text>

  <rect x="624" y="224" width="112" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
  <rect x="640" y="236" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.40)" stroke-width=".8"/>
  <text x="652" y="245" class="mono" text-anchor="middle">APP</text>
  <text x="680" y="268" class="name" text-anchor="middle">AI 应用 A</text>

  <rect x="624" y="400" width="112" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
  <rect x="640" y="412" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.40)" stroke-width=".8"/>
  <text x="652" y="421" class="mono" text-anchor="middle">APP</text>
  <text x="680" y="444" class="name" text-anchor="middle">AI 应用 B</text>

  <rect x="776" y="312" width="128" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="792" y="324" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,.50)" stroke-width=".8"/>
  <text x="812" y="333" class="mono" text-anchor="middle">CLIENT</text>
  <text x="840" y="356" class="name" text-anchor="middle">MCP Client</text>

  <rect x="944" y="312" width="128" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="960" y="324" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,.50)" stroke-width=".8"/>
  <text x="980" y="333" class="mono" text-anchor="middle">SERVER</text>
  <text x="1008" y="356" class="name" text-anchor="middle">MCP Server</text>

  <rect x="1112" y="312" width="112" height="72" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
  <rect x="1128" y="324" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,.50)" stroke-width=".8"/>
  <text x="1148" y="333" class="mono" text-anchor="middle">SYSTEM</text>
  <text x="1168" y="352" class="name" text-anchor="middle">GitLab · DB</text>
  <text x="1168" y="372" class="note" text-anchor="middle">文件系统</text>

  <text x="72" y="532" class="name">每新增一个应用或系统，都要增加并维护适配关系。</text>
  <text x="72" y="560" class="note">接入复杂度随“应用 × 外部系统”组合增长。</text>

  <text x="624" y="532" class="name">应用和 Server 只需遵循同一套能力描述与调用协议。</text>
  <text x="624" y="560" class="note">MCP 降低的是连接与复用成本，业务系统仍保留自己的 API。</text>

  <line x1="40" y1="644" x2="1240" y2="644" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
  <text x="40" y="676" class="mono">KEY TAKEAWAY</text>
  <text x="184" y="676" class="note">从重复私有适配，转向可发现、可描述、可复用的标准协议边界。</text>
</svg>
</body>
</html>
