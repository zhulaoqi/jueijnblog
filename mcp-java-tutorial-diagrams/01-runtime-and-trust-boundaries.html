<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运行时职责与信任边界</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font:400 16px/1.4 'Geist','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif}
    svg{display:block;width:960px;height:600px}
    .name{font:600 16px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.08em}
  </style>
</head>
<body>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-runtime-and-trust-boundaries-title 01-runtime-and-trust-boundaries-desc">
  <title id="01-runtime-and-trust-boundaries-title">运行时职责与信任边界</title>
  <desc id="01-runtime-and-trust-boundaries-desc">Host 内的 Client 经 Transport 连接 Server；协议边界不等于进程边界，跨请求业务状态必须由显式句柄引用而不是被称为 Session。</desc>
  <defs>
    <marker id="runtime-trust-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="runtime-trust-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="runtime-trust-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="56" class="mono">ARCHITECTURE · REQUEST-SCOPED</text>
  <text x="40" y="92" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">协议边界不等于进程边界</text>

  <rect x="40" y="128" width="352" height="304" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.18)"/>
  <rect x="56" y="120" width="88" height="16" rx="4" fill="#f5f5f5"/>
  <text x="100" y="132" class="mono" text-anchor="middle">HOST TRUST ZONE</text>
  <rect x="568" y="128" width="352" height="304" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.18)"/>
  <rect x="584" y="120" width="104" height="16" rx="4" fill="#f5f5f5"/>
  <text x="636" y="132" class="mono" text-anchor="middle">SERVER TRUST ZONE</text>

  <line x1="192" y1="236" x2="232" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-trust-arrow)"/>
  <line x1="360" y1="236" x2="416" y2="236" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#runtime-trust-arrow-link)"/>
  <line x1="544" y1="236" x2="608" y2="236" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#runtime-trust-arrow-link)"/>
  <path d="M676 276 V296 Q676 304 684 304 H828 Q836 304 836 312" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#runtime-trust-arrow-accent)"/>

  <g>
    <rect x="72" y="196" width="120" height="80" rx="8" fill="#fff" stroke="#2d3142"/>
    <text x="132" y="228" class="name" text-anchor="middle">Host</text>
    <text x="132" y="252" class="note" text-anchor="middle">UI · 模型 · 授权</text>
  </g>
  <g>
    <rect x="232" y="196" width="128" height="80" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="296" y="228" class="name" text-anchor="middle">MCP Client</text>
    <text x="296" y="252" class="note" text-anchor="middle">Host 内协议端点</text>
  </g>
  <g>
    <rect x="416" y="208" width="128" height="56" rx="8" fill="#fff" stroke="#2e5aa8"/>
    <text x="480" y="232" class="name" text-anchor="middle">Transport</text>
    <text x="480" y="252" class="mono" text-anchor="middle">STDIO / HTTP</text>
  </g>
  <g>
    <rect x="608" y="196" width="136" height="80" rx="8" fill="#fff" stroke="#2d3142"/>
    <text x="676" y="228" class="name" text-anchor="middle">MCP Server</text>
    <text x="676" y="252" class="note" text-anchor="middle">按请求独立处理</text>
  </g>
  <g>
    <rect x="760" y="312" width="152" height="88" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
    <text x="836" y="344" class="name" text-anchor="middle">业务状态</text>
    <text x="836" y="368" class="mono" text-anchor="middle">searchHandle</text>
    <text x="836" y="388" class="note" text-anchor="middle">非协议 Session</text>
  </g>

  <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(45,49,66,.14)"/>
  <text x="40" y="504" class="name">进程部署可以合并或拆分，职责与信任校验不能省略。</text>
  <text x="40" y="532" class="note">连接、PID 与自报 clientInfo/serverInfo 都不能充当用户或对话身份。</text>
</svg>
</body>
</html>
