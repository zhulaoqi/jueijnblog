<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>stdio 与现代 Streamable HTTP</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font:400 16px/1.4 'Geist','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif}svg{display:block;width:960px;height:600px}
    .name{font:600 16px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.06em}
  </style>
</head>
<body>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="05-transport-bindings-title 05-transport-bindings-desc">
  <title id="05-transport-bindings-title">stdio 与现代 Streamable HTTP</title>
  <desc id="05-transport-bindings-desc">stdio 使用单行 JSON-RPC 帧、取消通知和 stdin EOF 终止；现代 HTTP 每条 Client 消息使用 POST，响应为 JSON 或请求级 SSE，关闭流即取消且没有协议 Session 或 Last-Event-ID 恢复。</desc>
  <defs>
    <marker id="transport-bindings-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="transport-bindings-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="transport-bindings-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="40" y="52" class="mono">ARCHITECTURE · TRANSPORT BINDINGS</text>
  <text x="40" y="88" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">相同 JSON-RPC，不同终止与取消边界</text>

  <rect x="40" y="128" width="416" height="356" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.18)"/>
  <rect x="56" y="120" width="96" height="16" rx="4" fill="#f5f5f5"/><text x="104" y="132" class="mono" text-anchor="middle">STDIO BINDING</text>
  <rect x="504" y="128" width="416" height="356" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.18)"/>
  <rect x="520" y="120" width="136" height="16" rx="4" fill="#f5f5f5"/><text x="588" y="132" class="mono" text-anchor="middle">STREAMABLE HTTP</text>

  <line x1="176" y1="224" x2="204" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#transport-bindings-arrow)"/>
  <line x1="324" y1="224" x2="352" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#transport-bindings-arrow)"/>
  <line x1="648" y1="224" x2="664" y2="224" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#transport-bindings-arrow-link)"/>
  <line x1="776" y1="224" x2="792" y2="224" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#transport-bindings-arrow-link)"/>
  <path d="M848 264 V320 Q848 328 840 328 H792" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#transport-bindings-arrow)"/>
  <path d="M648 360 H608 Q600 360 600 352 V264" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#transport-bindings-arrow)"/>

  <g><rect x="72" y="184" width="104" height="80" rx="8" fill="#fff" stroke="#2d3142"/><text x="124" y="216" class="name" text-anchor="middle">Client</text><text x="124" y="240" class="note" text-anchor="middle">父进程</text></g>
  <g><rect x="204" y="176" width="120" height="96" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text x="264" y="208" class="name" text-anchor="middle">单行 JSON-RPC</text><text x="264" y="232" class="mono" text-anchor="middle">STDIN / STDOUT</text><text x="264" y="252" class="note" text-anchor="middle">一行一条消息</text></g>
  <g><rect x="352" y="184" width="80" height="80" rx="8" fill="#fff" stroke="#2d3142"/><text x="392" y="216" class="name" text-anchor="middle">Server</text><text x="392" y="240" class="note" text-anchor="middle">子进程</text></g>

  <rect x="72" y="312" width="360" height="132" rx="8" fill="#fff" stroke="rgba(45,49,66,.18)"/>
  <text x="92" y="344" class="mono">CANCEL</text><text x="184" y="344" class="note">notifications/cancelled 单行通知</text>
  <line x1="92" y1="360" x2="412" y2="360" stroke="rgba(45,49,66,.12)"/>
  <text x="92" y="392" class="mono">SHUTDOWN</text><text x="184" y="392" class="note">关闭 stdin → EOF → Server 退出</text>
  <text x="92" y="420" class="mono">STDERR</text><text x="184" y="420" class="note">日志通道，不得污染 stdout</text>

  <g><rect x="536" y="184" width="112" height="80" rx="8" fill="#fff" stroke="#2d3142"/><text x="592" y="216" class="name" text-anchor="middle">Client</text><text x="592" y="240" class="note" text-anchor="middle">每消息 POST</text></g>
  <g><rect x="664" y="176" width="112" height="96" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text x="720" y="208" class="name" text-anchor="middle">POST /mcp</text><text x="720" y="232" class="mono" text-anchor="middle">JSON BODY</text><text x="720" y="252" class="note" text-anchor="middle">单一 endpoint</text></g>
  <g><rect x="792" y="184" width="112" height="80" rx="8" fill="#fff" stroke="#2d3142"/><text x="848" y="216" class="name" text-anchor="middle">Server</text><text x="848" y="240" class="note" text-anchor="middle">逐请求处理</text></g>
  <g><rect x="648" y="328" width="144" height="64" rx="8" fill="#fff" stroke="#4f5d75"/><text x="720" y="352" class="name" text-anchor="middle">响应</text><text x="720" y="376" class="mono" text-anchor="middle">JSON / 请求级 SSE</text></g>
  <text x="808" y="356" class="mono">CLOSE SSE</text><text x="808" y="376" class="note">= 取消该请求</text>
  <text x="536" y="424" class="name">无 Session · 无 GET 收消息</text>
  <text x="536" y="452" class="note">无 Last-Event-ID 恢复；断流后按幂等性用新 ID 重发。</text>

  <line x1="40" y1="528" x2="920" y2="528" stroke="rgba(45,49,66,.14)"/>
  <text x="40" y="560" class="note">Transport 映射消息与流生命周期，不改变业务方法的协议语义。</text>
</svg>
</body>
</html>
