<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font:400 16px/1.4 'Geist','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif}svg{display:block;width:960px;height:600px}
    .name{font:600 16px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#2d3142}

<body>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="04-features-mrtr-and-subscriptions-title 04-features-mrtr-and-subscriptions-desc">
  <title id="04-features-mrtr-and-subscriptions-title">Features、MRTR 与资源订阅时序</title>
  <desc id="04-features-mrtr-and-subscriptions-desc">Client 通过 MRTR 取得用户输入并以新 ID 重试，随后用 subscriptions/listen 接收带同一 subscriptionId 的资源通知，再主动读取更新内容；Server 从不主动发 JSON-RPC Request。</desc>
  <defs>
    <marker id="seq-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="seq-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="seq-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    <marker id="seq-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>
  <text x="40" y="36" class="mono">SEQUENCE · 10 MESSAGES</text>
  <text x="40" y="68" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">Server 返回结果或通知，不主动发 Request</text>

  <rect x="40" y="84" width="120" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,.2)"/><text x="100" y="100" class="mono" text-anchor="middle">TOOLS · 操作</text>
  <rect x="168" y="84" width="152" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,.2)"/><text x="244" y="100" class="mono" text-anchor="middle">RESOURCES · 上下文</text>
  <rect x="328" y="84" width="280" height="24" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text x="468" y="100" class="mono" text-anchor="middle">PROMPT = 消息模板，非 TOOL</text>
  <rect x="616" y="84" width="304" height="24" rx="4" fill="#fff" stroke="rgba(45,49,66,.2)"/><text x="768" y="100" class="mono" text-anchor="middle">subscriptionId = listen 请求 ID</text>

  <rect x="396" y="432" width="428" height="128" rx="4" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.22)"/>
  <rect x="396" y="432" width="40" height="16" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,.22)"/>
  <text x="416" y="444" class="mono" text-anchor="middle">OPT</text>
  <text x="448" y="444" class="mono">[收到资源更新后]</text>

  <line x1="120" y1="160" x2="120" y2="568" stroke="rgba(45,49,66,.2)" stroke-dasharray="4,4"/>
  <line x1="440" y1="160" x2="440" y2="568" stroke="rgba(45,49,66,.2)" stroke-dasharray="4,4"/>
  <line x1="800" y1="160" x2="800" y2="568" stroke="rgba(45,49,66,.2)" stroke-dasharray="4,4"/>

  <line x1="440" y1="196" x2="800" y2="196" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#seq-arrow-link)"/>
  <line x1="800" y1="232" x2="440" y2="232" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow)"/>
  <line x1="120" y1="268" x2="440" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#seq-arrow)"/>
  <line x1="440" y1="304" x2="800" y2="304" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#seq-arrow-link)"/>

  <line x1="800" y1="412" x2="440" y2="412" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow-open)"/>
  <line x1="800" y1="476" x2="440" y2="476" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow-open)"/>
  <line x1="440" y1="512" x2="800" y2="512" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#seq-arrow-link)"/>
  <line x1="800" y1="548" x2="440" y2="548" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow)"/>

  <rect x="504" y="176" width="232" height="12" rx="4" fill="#f5f5f5"/><text x="620" y="184" class="mono" text-anchor="middle">tools/call search-1 · elicitation.form</text>
  <rect x="516" y="212" width="208" height="12" rx="4" fill="#f5f5f5"/><text x="620" y="220" class="mono" text-anchor="middle">InputRequiredResult · input_required</text>
  <rect x="216" y="248" width="128" height="12" rx="4" fill="#f5f5f5"/><text x="280" y="256" class="mono" text-anchor="middle">用户确认并填写输入</text>
  <rect x="528" y="284" width="184" height="12" rx="4" fill="#f5f5f5"/><text x="620" y="292" class="mono" text-anchor="middle">tools/call search-2 · 新 ID</text>
  <rect x="552" y="320" width="136" height="12" rx="4" fill="#f5f5f5"/><text x="620" y="328" class="mono" text-anchor="middle">complete · search-2</text>
  <rect x="520" y="356" width="200" height="12" rx="4" fill="#f5f5f5"/><text x="620" y="364" class="mono" text-anchor="middle">subscriptions/listen · listen-1</text>
  <rect x="520" y="392" width="200" height="12" rx="4" fill="#f5f5f5"/><text x="620" y="400" class="mono" text-anchor="middle">acknowledged · sid=listen-1</text>
  <rect x="516" y="456" width="208" height="12" rx="4" fill="#f5f5f5"/><text x="620" y="464" class="mono" text-anchor="middle">resources/updated · sid=listen-1</text>
  <rect x="552" y="492" width="136" height="12" rx="4" fill="#f5f5f5"/><text x="620" y="500" class="mono" text-anchor="middle">resources/read · read-1</text>
  <rect x="552" y="528" width="136" height="12" rx="4" fill="#f5f5f5"/><text x="620" y="536" class="mono" text-anchor="middle">complete · read-1</text>

  <g><rect x="64" y="120" width="112" height="40" rx="8" fill="#fff" stroke="#2d3142"/><text x="120" y="148" class="name" text-anchor="middle">User</text></g>
  <g><rect x="376" y="120" width="128" height="40" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/><text x="440" y="148" class="name" text-anchor="middle">Client</text></g>
  <g><rect x="736" y="120" width="128" height="40" rx="8" fill="#fff" stroke="#2d3142"/><text x="800" y="148" class="name" text-anchor="middle">Server</text></g>

</svg>
