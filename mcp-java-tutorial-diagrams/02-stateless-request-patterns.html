<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一次 MCP Tool 调用的完整链路</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font:400 16px/1.4 'Geist','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif}
    svg{display:block;width:960px;height:720px}
    .name{font:600 16px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.08em}
  </style>
</head>
<body>
<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="02-stateless-request-patterns-title 02-stateless-request-patterns-desc">
  <title id="02-stateless-request-patterns-title">一次 MCP Tool 调用的完整链路</title>
  <desc id="02-stateless-request-patterns-desc">用户问题先进入 Host，Host 获取工具并交给模型；模型只返回调用意图，Host 内的 MCP Client 才向 Server 发出 tools/call，执行结果写回模型后生成最终回答。</desc>
  <defs>
    <marker id="tool-chain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="tool-chain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="tool-chain-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="960" height="720" fill="#f5f5f5"/>

  <text x="32" y="44" class="mono">SEQUENCE · END-TO-END TOOL CALL</text>
  <text x="32" y="80" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">模型表达意图，Host 执行调用</text>
  <text x="32" y="104" class="note">发现、决策、执行、回填，是四个不同阶段。</text>

  <line x1="80" y1="168" x2="80" y2="680" stroke="rgba(45,49,66,.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="272" y1="168" x2="272" y2="680" stroke="rgba(45,49,66,.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="464" y1="168" x2="464" y2="680" stroke="rgba(45,49,66,.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="656" y1="168" x2="656" y2="680" stroke="rgba(45,49,66,.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="848" y1="168" x2="848" y2="680" stroke="rgba(45,49,66,.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="268" y="196" width="8" height="452" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width=".8"/>
  <rect x="460" y="316" width="8" height="52" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width=".8"/>
  <rect x="460" y="556" width="8" height="52" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width=".8"/>
  <rect x="652" y="236" width="8" height="292" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width=".8"/>
  <rect x="844" y="436" width="8" height="52" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width=".8"/>

  <line x1="80" y1="200" x2="268" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-chain-arrow)"/>
  <rect x="116" y="176" width="116" height="12" rx="2" fill="#f5f5f5"/>
  <text x="174" y="185" class="mono" text-anchor="middle">用户自然语言问题</text>

  <line x1="276" y1="240" x2="652" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#tool-chain-arrow-link)"/>
  <rect x="412" y="216" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="225" class="mono" text-anchor="middle">tools/list</text>

  <line x1="652" y1="280" x2="276" y2="280" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#tool-chain-arrow)"/>
  <rect x="400" y="256" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="265" class="mono" text-anchor="middle">Tool + inputSchema</text>

  <line x1="276" y1="320" x2="460" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-chain-arrow)"/>
  <rect x="312" y="296" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="368" y="305" class="mono" text-anchor="middle">问题 + 可用工具</text>

  <line x1="460" y1="360" x2="276" y2="360" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#tool-chain-arrow)"/>
  <rect x="304" y="336" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="368" y="345" class="mono" text-anchor="middle">Tool Calling 意图</text>

  <line x1="276" y1="400" x2="652" y2="400" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#tool-chain-arrow-link)"/>
  <rect x="388" y="376" width="152" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="385" class="mono" text-anchor="middle">tools/call + arguments</text>

  <line x1="660" y1="440" x2="844" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-chain-arrow)"/>
  <rect x="696" y="416" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="752" y="425" class="mono" text-anchor="middle">调用真实业务能力</text>

  <line x1="844" y1="480" x2="660" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#tool-chain-arrow)"/>
  <rect x="696" y="456" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="752" y="465" class="mono" text-anchor="middle">业务数据</text>

  <line x1="652" y1="520" x2="276" y2="520" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#tool-chain-arrow-accent)"/>
  <rect x="388" y="496" width="152" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="505" class="mono" text-anchor="middle">CallToolResult · 同一 ID</text>

  <line x1="276" y1="560" x2="460" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-chain-arrow)"/>
  <rect x="312" y="536" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="368" y="545" class="mono" text-anchor="middle">写入 Tool Result</text>

  <line x1="460" y1="600" x2="276" y2="600" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#tool-chain-arrow)"/>
  <rect x="312" y="576" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="368" y="585" class="mono" text-anchor="middle">生成最终答案</text>

  <line x1="268" y1="640" x2="80" y2="640" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#tool-chain-arrow)"/>
  <rect x="116" y="616" width="116" height="12" rx="2" fill="#f5f5f5"/>
  <text x="174" y="625" class="mono" text-anchor="middle">自然语言回答</text>

  <rect x="24" y="128" width="112" height="40" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="80" y="153" class="name" text-anchor="middle">用户</text>

  <rect x="196" y="128" width="152" height="40" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
  <text x="272" y="153" class="name" text-anchor="middle">Host / MCP Client</text>

  <rect x="400" y="128" width="128" height="40" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="464" y="153" class="name" text-anchor="middle">模型</text>

  <rect x="592" y="128" width="128" height="40" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="656" y="153" class="name" text-anchor="middle">MCP Server</text>

  <rect x="776" y="128" width="144" height="40" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
  <text x="848" y="153" class="name" text-anchor="middle">业务系统</text>

  <line x1="32" y1="688" x2="928" y2="688" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
  <text x="32" y="708" class="note">关键边界：模型不访问 Server；Host 把模型意图转换为 MCP 调用，并把结果送回模型。</text>
</svg>
</body>
</html>
