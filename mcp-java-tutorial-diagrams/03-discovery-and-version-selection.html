<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCP JSON-RPC 调用的消息骨架</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font:400 16px/1.4 'Geist','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif}
    svg{display:block;width:960px;height:600px}
    .name{font:600 16px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.08em}
  </style>
</head>
<body>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="03-discovery-and-version-selection-title 03-discovery-and-version-selection-desc">
  <title id="03-discovery-and-version-selection-title">MCP JSON-RPC 调用的消息骨架</title>
  <desc id="03-discovery-and-version-selection-desc">左侧请求由 JSON-RPC 字段、MCP 方法和 params 组成；右侧响应用同一请求 ID 关联，并在 result 中返回完成状态、文本内容和结构化内容。</desc>
  <defs>
    <marker id="message-anatomy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="message-anatomy-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="message-anatomy-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="960" height="600" fill="#f5f5f5"/>

  <text x="40" y="44" class="mono">NESTED · JSON-RPC MESSAGE</text>
  <text x="40" y="80" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">协议先定位请求，再解释 MCP 语义</text>
  <text x="40" y="104" class="note">id 负责关联；method 决定动作；params 与 result 承载领域数据。</text>

  <line x1="440" y1="184" x2="520" y2="184" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#message-anatomy-arrow-accent)"/>
  <rect x="452" y="156" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="480" y="165" class="mono" text-anchor="middle">同一 ID</text>

  <rect x="40" y="128" width="400" height="368" rx="8" fill="rgba(45,49,66,.015)" stroke="rgba(45,49,66,.36)" stroke-width="1"/>
  <rect x="56" y="120" width="112" height="16" rx="2" fill="#f5f5f5"/>
  <text x="112" y="132" class="mono" text-anchor="middle">JSON-RPC REQUEST</text>

  <rect x="72" y="160" width="88" height="48" rx="6" fill="#fff" stroke="#4f5d75"/>
  <text x="116" y="180" class="mono" text-anchor="middle">jsonrpc</text>
  <text x="116" y="196" class="note" text-anchor="middle">"2.0"</text>

  <rect x="176" y="160" width="88" height="48" rx="6" fill="#fff" stroke="#4f5d75"/>
  <text x="220" y="180" class="mono" text-anchor="middle">id</text>
  <text x="220" y="196" class="note" text-anchor="middle">"tool-42"</text>

  <rect x="280" y="160" width="128" height="48" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
  <text x="344" y="180" class="mono" text-anchor="middle">method</text>
  <text x="344" y="196" class="note" text-anchor="middle">tools/call</text>

  <rect x="72" y="240" width="336" height="224" rx="8" fill="rgba(45,49,66,.025)" stroke="#4f5d75"/>
  <rect x="88" y="232" width="64" height="16" rx="2" fill="#f5f5f5"/>
  <text x="120" y="244" class="mono" text-anchor="middle">PARAMS</text>

  <rect x="104" y="272" width="272" height="48" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="120" y="292" class="mono">name</text>
  <text x="360" y="304" class="note" text-anchor="end">search_documents</text>

  <rect x="104" y="336" width="272" height="48" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="120" y="356" class="mono">arguments</text>
  <text x="360" y="368" class="note" text-anchor="end">{ query: "支付超时" }</text>

  <rect x="104" y="400" width="272" height="40" rx="6" fill="rgba(45,49,66,.04)" stroke="#4f5d75" stroke-dasharray="4,3"/>
  <text x="120" y="424" class="mono">_meta</text>
  <text x="360" y="424" class="note" text-anchor="end">版本 · 能力</text>

  <rect x="520" y="128" width="400" height="368" rx="8" fill="rgba(45,49,66,.015)" stroke="rgba(45,49,66,.36)" stroke-width="1"/>
  <rect x="536" y="120" width="120" height="16" rx="2" fill="#f5f5f5"/>
  <text x="596" y="132" class="mono" text-anchor="middle">JSON-RPC RESPONSE</text>

  <rect x="552" y="160" width="120" height="48" rx="6" fill="#fff" stroke="#4f5d75"/>
  <text x="612" y="180" class="mono" text-anchor="middle">jsonrpc</text>
  <text x="612" y="196" class="note" text-anchor="middle">"2.0"</text>

  <rect x="688" y="160" width="120" height="48" rx="6" fill="#fff" stroke="#4f5d75"/>
  <text x="748" y="180" class="mono" text-anchor="middle">id</text>
  <text x="748" y="196" class="note" text-anchor="middle">"tool-42"</text>

  <rect x="552" y="240" width="336" height="224" rx="8" fill="rgba(235,108,54,.06)" stroke="#eb6c36"/>
  <rect x="568" y="232" width="64" height="16" rx="2" fill="#f5f5f5"/>
  <text x="600" y="244" class="mono" text-anchor="middle">RESULT</text>

  <rect x="584" y="272" width="272" height="40" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="600" y="296" class="mono">resultType</text>
  <text x="840" y="296" class="note" text-anchor="end">complete</text>

  <rect x="584" y="328" width="272" height="40" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="600" y="352" class="mono">content</text>
  <text x="840" y="352" class="note" text-anchor="end">给模型阅读</text>

  <rect x="584" y="384" width="272" height="40" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="600" y="408" class="mono">structuredContent</text>
  <text x="840" y="408" class="note" text-anchor="end">给程序消费</text>

  <text x="552" y="484" class="mono">失败分支使用 error；成功响应不能同时携带 error。</text>

  <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
  <text x="40" y="568" class="name">读消息的顺序：先看 id 与 method，再进入 params 或 result。</text>
</svg>
</body>
</html>
