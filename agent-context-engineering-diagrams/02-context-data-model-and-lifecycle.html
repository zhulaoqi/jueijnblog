<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>持久数据经过 Runtime 编译成临时 Context</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font-family:'Geist','PingFang SC','Noto Sans CJK SC',sans-serif}
    svg{display:block;width:1280px;height:720px}
    .title{font:600 28px 'Geist','PingFang SC',sans-serif;fill:#2d3142}
    .name{font:600 16px 'Geist','PingFang SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.04em}
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-model-title context-model-desc">
  <title id="context-model-title">持久数据经过 Runtime 编译成临时 Context</title>
  <desc id="context-model-desc">事件历史、状态检查点、制品、摘要记录和长期记忆按需进入 Context Assembler，经过选择、裁剪与预算后，只将本轮最小充分工作集发送给模型。</desc>
  <defs>
    <marker id="context-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="context-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="context-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>

  <text x="40" y="44" class="mono">ARCHITECTURE · PERSISTENT DATA TO EPHEMERAL VIEW</text>
  <text x="40" y="80" class="title">持久数据经过 Runtime 编译成临时 Context</text>
  <text x="40" y="108" class="note">Context 不是存储层的镜像，而是 Runtime 为当前轮次选择、压缩并排序后的工作视图。</text>

  <rect x="40" y="148" width="304" height="440" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
  <rect x="56" y="140" width="112" height="16" rx="4" fill="#f5f5f5"/>
  <text x="112" y="152" class="mono" text-anchor="middle">DURABLE SOURCES</text>
  <rect x="488" y="148" width="376" height="440" rx="8" fill="rgba(235,108,54,.03)" stroke="rgba(235,108,54,.28)" stroke-dasharray="4,4"/>
  <rect x="504" y="140" width="120" height="16" rx="4" fill="#f5f5f5"/>
  <text x="564" y="152" class="mono" text-anchor="middle">RUNTIME COMPILE</text>
  <rect x="968" y="148" width="272" height="440" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
  <rect x="984" y="140" width="104" height="16" rx="4" fill="#f5f5f5"/>
  <text x="1036" y="152" class="mono" text-anchor="middle">TURN INPUT</text>

  <path d="M304 196 H352 Q360 196 360 204 V308 Q360 316 368 316 H512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-arrow)"/>
  <path d="M304 280 H352 a8 8 0 0 1 16 0 H376 Q384 280 384 288 V340 Q384 348 392 348 H512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-arrow)"/>
  <path d="M304 364 H400 Q408 364 408 372 Q408 380 416 380 H512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-arrow)"/>
  <path d="M304 448 H424 Q432 448 432 440 V420 Q432 412 440 412 H512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-arrow)"/>
  <path d="M304 532 H448 Q456 532 456 524 V452 Q456 444 464 444 H512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-arrow)"/>
  <line x1="832" y1="380" x2="984" y2="380" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#context-accent)"/>

  <rect x="872" y="344" width="88" height="16" rx="4" fill="#f5f5f5"/>
  <text x="916" y="356" class="mono" text-anchor="middle" fill="#eb6c36">MINIMUM SET</text>

  <rect x="64" y="156" width="240" height="80" rx="8" fill="#fff" stroke="#2d3142"/>
  <text x="184" y="184" class="name" text-anchor="middle">Event / History</text>
  <text x="184" y="208" class="mono" text-anchor="middle">ORDERED FACTS</text>
  <text x="184" y="224" class="mono" text-anchor="middle">REPLAYABLE</text>

  <rect x="64" y="240" width="240" height="80" rx="8" fill="rgba(45,49,66,.04)" stroke="#4f5d75"/>
  <text x="184" y="268" class="name" text-anchor="middle">State / Checkpoint</text>
  <text x="184" y="292" class="mono" text-anchor="middle">CURRENT STATE</text>
  <text x="184" y="308" class="mono" text-anchor="middle">RESUME POINT</text>

  <rect x="64" y="324" width="240" height="80" rx="8" fill="rgba(46,90,168,.05)" stroke="#2e5aa8"/>
  <text x="184" y="352" class="name" text-anchor="middle">Artifact</text>
  <text x="184" y="376" class="mono" text-anchor="middle">EXACT BYTES</text>
  <text x="184" y="392" class="mono" text-anchor="middle">VERSIONED REF</text>

  <rect x="64" y="408" width="240" height="80" rx="8" fill="rgba(45,49,66,.04)" stroke="#4f5d75"/>
  <text x="184" y="436" class="name" text-anchor="middle">Summary Record</text>
  <text x="184" y="460" class="mono" text-anchor="middle">CLOSED HISTORY</text>
  <text x="184" y="476" class="mono" text-anchor="middle">SOURCED</text>

  <rect x="64" y="492" width="240" height="80" rx="8" fill="#fff" stroke="#2d3142"/>
  <text x="184" y="520" class="name" text-anchor="middle">Long-Term Memory</text>
  <text x="184" y="544" class="mono" text-anchor="middle">RETRIEVED</text>
  <text x="184" y="560" class="mono" text-anchor="middle">BY RELEVANCE</text>

  <rect x="512" y="280" width="320" height="200" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="528" y="296" width="96" height="16" rx="4" fill="rgba(235,108,54,.14)"/>
  <text x="576" y="308" class="mono" text-anchor="middle" fill="#eb6c36">COMPILE VIEW</text>
  <text x="672" y="348" class="name" text-anchor="middle">Context Assembler</text>
  <text x="672" y="376" class="mono" text-anchor="middle">SCOPE → RETRIEVE</text>
  <text x="672" y="396" class="mono" text-anchor="middle">SELECT → ORDER</text>
  <text x="672" y="416" class="mono" text-anchor="middle">PRUNE → EXTERNALIZE</text>
  <text x="672" y="436" class="mono" text-anchor="middle">SUMMARIZE → BUDGET</text>
  <text x="672" y="464" class="note" text-anchor="middle">按需读取，不复制完整持久层</text>

  <rect x="984" y="328" width="240" height="104" rx="8" fill="#fff" stroke="#2e5aa8"/>
  <text x="1104" y="364" class="name" text-anchor="middle">Model Context</text>
  <text x="1104" y="392" class="mono" text-anchor="middle">CURRENT TURN ONLY</text>
  <text x="1104" y="412" class="mono" text-anchor="middle">MINIMUM SUFFICIENT SET</text>

  <line x1="40" y1="616" x2="1240" y2="616" stroke="rgba(45,49,66,.16)"/>
  <text x="40" y="652" class="name">Summary ≠ Memory</text>
  <text x="444" y="652" class="name">History ≠ Context</text>
  <text x="820" y="652" class="name">Prune ≠ Delete</text>
  <text x="40" y="680" class="mono">SUMMARY COMPRESSES CLOSED EVENTS</text>
  <text x="444" y="680" class="mono">CONTEXT IS A COMPILED TURN VIEW</text>
  <text x="820" y="680" class="mono">PRUNE REMOVES FROM VIEW, NOT STORAGE</text>
</svg>
</body>
</html>
