<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skill 发现、激活与执行时序</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font:400 16px/1.4 'Geist','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif}
    svg{display:block;width:960px;height:680px}
    .name{font:600 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.08em}
  </style>
</head>
<body>
<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="02-skill-discovery-activation-sequence-title 02-skill-discovery-activation-sequence-desc">
  <title id="02-skill-discovery-activation-sequence-title">Skill 发现、激活与执行时序</title>
  <desc id="02-skill-discovery-activation-sequence-desc">Runtime 先从 Skill Store 读取名称和描述构建目录；模型根据任务选择 Skill 后，Runtime 才读取完整指令，并按需执行脚本和工具。</desc>
  <defs>
    <marker id="activation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="activation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="activation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="960" height="680" fill="#f5f5f5"/>

  <text x="40" y="44" class="mono">SEQUENCE · PROGRESSIVE DISCLOSURE</text>
  <text x="40" y="80" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">先发现元数据，命中后才加载完整 Skill</text>
  <text x="40" y="104" class="note">这使 Runtime 能挂载大量 Skill，而不必把全部说明一次性塞进上下文。</text>

  <line x1="104" y1="176" x2="104" y2="624" stroke="rgba(45,49,66,.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="344" y1="176" x2="344" y2="624" stroke="rgba(45,49,66,.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="584" y1="176" x2="584" y2="624" stroke="rgba(45,49,66,.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="824" y1="176" x2="824" y2="624" stroke="rgba(45,49,66,.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="340" y="188" width="8" height="420" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width=".8"/>
  <rect x="580" y="300" width="8" height="284" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width=".8"/>
  <rect x="820" y="188" width="8" height="260" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width=".8"/>

  <line x1="348" y1="200" x2="820" y2="200" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#activation-arrow-link)"/>
  <rect x="524" y="176" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="584" y="185" class="mono" text-anchor="middle">扫描 Skill 目录</text>

  <line x1="820" y1="240" x2="348" y2="240" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#activation-arrow)"/>
  <rect x="508" y="216" width="152" height="12" rx="2" fill="#f5f5f5"/>
  <text x="584" y="225" class="mono" text-anchor="middle">name + description</text>

  <line x1="104" y1="280" x2="340" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#activation-arrow)"/>
  <rect x="172" y="256" width="100" height="12" rx="2" fill="#f5f5f5"/>
  <text x="222" y="265" class="mono" text-anchor="middle">提交真实任务</text>

  <line x1="348" y1="320" x2="580" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#activation-arrow)"/>
  <rect x="404" y="296" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="305" class="mono" text-anchor="middle">任务 + Skill Catalog</text>

  <line x1="580" y1="360" x2="348" y2="360" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#activation-arrow-accent)"/>
  <rect x="396" y="336" width="136" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="345" class="mono" text-anchor="middle">选择并激活 Skill</text>

  <line x1="348" y1="400" x2="820" y2="400" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#activation-arrow-link)"/>
  <rect x="520" y="376" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="584" y="385" class="mono" text-anchor="middle">读取完整 SKILL.md</text>

  <line x1="820" y1="440" x2="348" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#activation-arrow)"/>
  <rect x="520" y="416" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="584" y="425" class="mono" text-anchor="middle">返回专业流程</text>

  <line x1="348" y1="480" x2="580" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#activation-arrow)"/>
  <rect x="400" y="456" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="465" class="mono" text-anchor="middle">注入 Skill 指令</text>

  <line x1="580" y1="520" x2="348" y2="520" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#activation-arrow-link)"/>
  <rect x="388" y="496" width="152" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="505" class="mono" text-anchor="middle">请求脚本 / Tool / MCP</text>

  <line x1="348" y1="560" x2="580" y2="560" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#activation-arrow)"/>
  <rect x="404" y="536" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="545" class="mono" text-anchor="middle">执行结果</text>

  <line x1="580" y1="584" x2="348" y2="584" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#activation-arrow)"/>
  <rect x="412" y="560" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="464" y="569" class="mono" text-anchor="middle">生成结果</text>

  <line x1="340" y1="616" x2="108" y2="616" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#activation-arrow)"/>
  <rect x="164" y="592" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="224" y="601" class="mono" text-anchor="middle">最终回答 / 产物</text>

  <rect x="40" y="136" width="128" height="40" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="104" y="161" class="name" text-anchor="middle">用户</text>

  <rect x="280" y="136" width="128" height="40" rx="6" fill="#fff" stroke="#2d3142"/>
  <text x="344" y="161" class="name" text-anchor="middle">Agent Runtime</text>

  <rect x="520" y="136" width="128" height="40" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
  <text x="584" y="161" class="name" text-anchor="middle">模型</text>

  <rect x="760" y="136" width="128" height="40" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
  <text x="824" y="161" class="name" text-anchor="middle">Skill Store</text>

  <line x1="40" y1="640" x2="920" y2="640" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
  <text x="40" y="664" class="note">references、scripts 和 assets 仍留在文件系统，只在流程需要时读取或执行。</text>
</svg>
</body>
</html>
