  <desc id="01-skill-position-in-agent-system-desc">Skill 位于 Agent Runtime 的按需行为层，为模型提供专业流程；Rules 提供常驻约束，Memory 和 RAG 提供事实，Tools 和 MCP 执行外部操作。</desc>
