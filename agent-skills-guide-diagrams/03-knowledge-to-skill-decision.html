<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知识是否应该 Skill 化</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f5f5f5;color:#2d3142}
    body{font:400 16px/1.4 'Geist','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif}
    svg{display:block;width:1280px;height:720px}
    .name{font:600 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#2d3142}
    .note{font:400 12px 'Geist','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#4f5d75}
    .mono{font:500 8px 'Geist Mono','PingFang SC',monospace;fill:#4f5d75;letter-spacing:.08em}
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="03-knowledge-to-skill-decision-title 03-knowledge-to-skill-decision-desc">
  <title id="03-knowledge-to-skill-decision-title">知识是否应该 Skill 化</title>
  <desc id="03-knowledge-to-skill-decision-desc">稳定流程进入 SKILL.md，小而稳定的事实进入 references，大规模动态或受权限控制的事实进入外部知识库；需要检索方法时再由 Skill 编排搜索或 MCP。</desc>
  <defs>
    <marker id="knowledge-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="knowledge-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="knowledge-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>

  <text x="40" y="44" class="mono">FLOWCHART · KNOWLEDGE PLACEMENT</text>
  <text x="40" y="80" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">Skill 保存方法，知识库保存当前事实</text>
  <text x="40" y="104" class="note">先判断知识的性质、规模和更新方式，再决定进入正文、reference 还是外部检索系统。</text>

  <line x1="640" y1="168" x2="640" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-arrow)"/>
  <line x1="760" y1="232" x2="920" y2="232" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#knowledge-arrow-accent)"/>
  <rect x="820" y="208" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="840" y="217" class="mono" text-anchor="middle">方法</text>

  <line x1="640" y1="280" x2="640" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-arrow)"/>
  <rect x="652" y="288" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="672" y="297" class="mono" text-anchor="middle">事实</text>

  <line x1="760" y1="360" x2="920" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-arrow)"/>
  <rect x="820" y="336" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="840" y="345" class="mono" text-anchor="middle">是</text>

  <line x1="640" y1="408" x2="640" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-arrow)"/>
  <rect x="652" y="416" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="672" y="425" class="mono" text-anchor="middle">否</text>

  <line x1="640" y1="512" x2="640" y2="536" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#knowledge-arrow-link)"/>

  <line x1="760" y1="580" x2="920" y2="580" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#knowledge-arrow-accent)"/>
  <rect x="820" y="556" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="840" y="565" class="mono" text-anchor="middle">需要</text>

  <line x1="640" y1="624" x2="640" y2="648" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-arrow)"/>
  <rect x="652" y="628" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="676" y="637" class="mono" text-anchor="middle">不需要</text>

  <rect x="560" y="128" width="160" height="40" rx="20" fill="#fff" stroke="#2d3142"/>
  <text x="640" y="153" class="name" text-anchor="middle">待沉淀的知识</text>

  <polygon points="640,184 760,232 640,280 520,232" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <text x="640" y="228" class="name" text-anchor="middle">它是方法还是事实？</text>
  <text x="640" y="248" class="note" text-anchor="middle">流程 · 决策 · 约束</text>

  <rect x="920" y="196" width="240" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
  <text x="1040" y="224" class="name" text-anchor="middle">写入 SKILL.md</text>
  <text x="1040" y="248" class="note" text-anchor="middle">核心流程 · Gotchas · 完成条件</text>

  <polygon points="640,312 760,360 640,408 520,360" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <text x="640" y="356" class="name" text-anchor="middle">规模小且相对稳定？</text>
  <text x="640" y="376" class="note" text-anchor="middle">可按任务精确读取</text>

  <rect x="920" y="324" width="240" height="72" rx="6" fill="#fff" stroke="#4f5d75"/>
  <text x="1040" y="352" class="name" text-anchor="middle">写入 references/</text>
  <text x="1040" y="376" class="note" text-anchor="middle">API 说明 · 术语 · 错误码</text>

  <rect x="528" y="448" width="224" height="64" rx="6" fill="rgba(45,49,66,.05)" stroke="#2e5aa8"/>
  <text x="640" y="476" class="name" text-anchor="middle">外部知识库 / RAG</text>
  <text x="640" y="496" class="note" text-anchor="middle">动态 · 大规模 · 权限过滤</text>

  <polygon points="640,536 760,580 640,624 520,580" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <text x="640" y="576" class="name" text-anchor="middle">需要指导 Agent 检索？</text>
  <text x="640" y="596" class="note" text-anchor="middle">查询 · 来源 · 验证</text>

  <rect x="920" y="544" width="240" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
  <text x="1040" y="572" class="name" text-anchor="middle">Skill + Search / MCP</text>
  <text x="1040" y="596" class="note" text-anchor="middle">Skill 编排方法，知识库返回事实</text>

  <rect x="560" y="648" width="160" height="40" rx="20" fill="#fff" stroke="#4f5d75"/>
  <text x="640" y="673" class="name" text-anchor="middle">直接使用知识系统</text>

  <rect x="40" y="184" width="328" height="168" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.14)" stroke-dasharray="4,4"/>
  <rect x="56" y="176" width="88" height="16" rx="2" fill="#f5f5f5"/>
  <text x="100" y="188" class="mono" text-anchor="middle">RULE OF THUMB</text>
  <text x="72" y="224" class="name">正文放方法</text>
  <text x="72" y="252" class="name">reference 放小型稳定资料</text>
  <text x="72" y="280" class="name">知识库放动态事实</text>
  <text x="72" y="316" class="note">不要把“文件很多”误认为已经完成知识管理。</text>
</svg>
</body>
</html>
