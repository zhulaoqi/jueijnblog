<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cron 调度的是一次完整 Agent Run</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Process · Cron</p>
    <h1>Cron 调度的是一次完整 Agent Run</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 408" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="cron-tick-title cron-tick-desc">
        <title id="cron-tick-title">Cron 调度的是一次完整 Agent Run</title>
        <desc id="cron-tick-desc">Cron 触发后先加锁并加载任务，再创建新 AIAgent、投递结果并原子更新下一次运行状态。</desc>

      <defs>
        <marker id="cron-tick-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="cron-tick-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="cron-tick-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="408" fill="#f5f5f5"/>
<path d="M 240,264 L 280,264" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cron-tick-arrow)"/>
<path d="M 464,264 L 504,264" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cron-tick-arrow)"/>
<path d="M 704,264 L 744,264" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cron-tick-arrow)"/>
<path d="M 928,264 L 968,264" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cron-tick-arrow)"/>
        <g>
          <rect x="48" y="88" width="32" height="24" rx="8" fill="rgba(45,49,66,0.08)"/>
          <text x="64" y="104" fill="#4f5d75" font-size="12" font-weight="600"
                font-family="'Geist Mono',monospace" text-anchor="middle">1</text>
          <text x="92" y="108" fill="#4f5d75" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">触发</text>
        </g>

        <g>
          <rect x="280" y="88" width="32" height="24" rx="8" fill="rgba(45,49,66,0.08)"/>
          <text x="296" y="104" fill="#4f5d75" font-size="12" font-weight="600"
                font-family="'Geist Mono',monospace" text-anchor="middle">2</text>
          <text x="324" y="108" fill="#4f5d75" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">装载</text>
        </g>

        <g>
          <rect x="504" y="88" width="32" height="24" rx="8" fill="rgba(45,49,66,0.08)"/>
          <text x="520" y="104" fill="#4f5d75" font-size="12" font-weight="600"
                font-family="'Geist Mono',monospace" text-anchor="middle">3</text>
          <text x="548" y="108" fill="#4f5d75" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">执行</text>
        </g>

        <g>
          <rect x="744" y="88" width="32" height="24" rx="8" fill="rgba(45,49,66,0.08)"/>
          <text x="760" y="104" fill="#4f5d75" font-size="12" font-weight="600"
                font-family="'Geist Mono',monospace" text-anchor="middle">4</text>
          <text x="788" y="108" fill="#4f5d75" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">投递</text>
        </g>

        <g>
          <rect x="968" y="88" width="32" height="24" rx="8" fill="rgba(45,49,66,0.08)"/>
          <text x="984" y="104" fill="#4f5d75" font-size="12" font-weight="600"
                font-family="'Geist Mono',monospace" text-anchor="middle">5</text>
          <text x="1012" y="108" fill="#4f5d75" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">提交</text>
        </g>

        <g>
          <rect x="48" y="200" width="192" height="128" rx="8" fill="#f5f5f5"/>
          <rect x="48" y="200" width="192" height="128" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="60" y="208" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="80" y="216" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">TICK</text>
          <text x="144" y="264" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="144" dy="0">Tick + 文件锁</tspan></text>
          <text x="144" y="284" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="144" dy="0">防重复触发</tspan><tspan x="144" dy="16">跨进程互斥</tspan></text>
        </g>

        <g>
          <rect x="280" y="200" width="184" height="128" rx="8" fill="#f5f5f5"/>
          <rect x="280" y="200" width="184" height="128" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="292" y="208" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="312" y="216" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">JOB</text>
          <text x="372" y="264" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="372" dy="0">加载 Job</tspan></text>
          <text x="372" y="284" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="372" dy="0">Prompt · Schedule</tspan><tspan x="372" dy="16">Skills · Target</tspan></text>
        </g>

        <g>
          <rect x="504" y="200" width="200" height="128" rx="8" fill="#f5f5f5"/>
          <rect x="504" y="200" width="200" height="128" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="516" y="208" width="48" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="540" y="216" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">AGENT</text>
          <text x="604" y="264" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="604" dy="0">Fresh AIAgent</tspan></text>
          <text x="604" y="284" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="604" dy="0">新 Session</tspan><tspan x="604" dy="16">禁用 cronjob</tspan></text>
        </g>

        <g>
          <rect x="744" y="200" width="184" height="128" rx="8" fill="#f5f5f5"/>
          <rect x="744" y="200" width="184" height="128" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="756" y="208" width="64" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="788" y="216" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">DELIVER</text>
          <text x="836" y="264" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="836" dy="0">投递结果</tspan></text>
          <text x="836" y="284" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="836" dy="0">目标独立</tspan><tspan x="836" dy="16">不污染聊天</tspan></text>
        </g>

        <g>
          <rect x="968" y="200" width="184" height="128" rx="8" fill="#f5f5f5"/>
          <rect x="968" y="200" width="184" height="128" rx="8" fill="rgba(45,49,66,0.05)"
                stroke="#4f5d75" stroke-width="1.2"/>
          <rect x="980" y="208" width="48" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="1004" y="216" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">STATE</text>
          <text x="1060" y="264" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1060" dy="0">原子更新</tspan></text>
          <text x="1060" y="284" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1060" dy="0">status</tspan><tspan x="1060" dy="16">next_run</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
