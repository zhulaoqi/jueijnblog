<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>会话、记忆、检索与技能分层</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Layer Stack · Memory</p>
    <h1>会话、记忆、检索与技能分层</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="memory-layers-title memory-layers-desc">
        <title id="memory-layers-title">会话、记忆、检索与技能分层</title>
        <desc id="memory-layers-desc">Hermes 将工作上下文、整理记忆、会话历史、历史检索和程序性技能分为五层。</desc>

      <defs>
        <marker id="memory-layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="memory-layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="memory-layers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="560" fill="#f5f5f5"/>
<text x="92" y="68" fill="#4f5d75" font-size="12" font-family="'Geist Mono',monospace" text-anchor="start" letter-spacing=".06em">参与推理频率 ↑</text>
<path d="M 72,492 L 72,92" fill="none" stroke="#eb6c36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#memory-layers-arrow-accent)"/>

        <g>
          <rect x="160" y="60" width="960" height="80" rx="8" fill="rgba(45,49,66,0.025)"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="180" y="104" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">L5</text>
          <text x="276" y="104" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">工作记忆</text>
          <text x="1100" y="104" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">当前 Prompt · 最近消息 · 工具结果</text>
        </g>

        <g>
          <rect x="160" y="148" width="960" height="80" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <text x="180" y="192" fill="#eb6c36"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">L4</text>
          <text x="276" y="192" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">整理记忆</text>
          <text x="1100" y="192" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">MEMORY.md · USER.md · 有界可读</text>
        </g>

        <g>
          <rect x="160" y="236" width="960" height="80" rx="8" fill="rgba(45,49,66,0.025)"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="180" y="280" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">L3</text>
          <text x="276" y="280" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">情节历史</text>
          <text x="1100" y="280" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">SQLite Session · FTS5 · 原文可审计</text>
        </g>

        <g>
          <rect x="160" y="324" width="960" height="80" rx="8" fill="rgba(45,49,66,0.025)"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="180" y="368" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">L2</text>
          <text x="276" y="368" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">历史检索</text>
          <text x="1100" y="368" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">session_search · 按需召回</text>
        </g>

        <g>
          <rect x="160" y="412" width="960" height="80" rx="8" fill="#ffffff"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="180" y="456" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">L1</text>
          <text x="276" y="456" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">程序性技能</text>
          <text x="1100" y="456" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">Skills · 可复用的“怎么做”</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
