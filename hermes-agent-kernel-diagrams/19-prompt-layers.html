<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prompt 组装：稳定前缀与易变上下文分离</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Layer Stack · Prompt</p>
    <h1>Prompt 组装：稳定前缀与易变上下文分离</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="prompt-layers-title prompt-layers-desc">
        <title id="prompt-layers-title">Prompt 组装：稳定前缀与易变上下文分离</title>
        <desc id="prompt-layers-desc">系统 Prompt 将身份与工具规范放入稳定前缀，把记忆、Skills、项目和会话信息放入易变上下文。</desc>

      <defs>
        <marker id="prompt-layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="prompt-layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="prompt-layers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="560" fill="#f5f5f5"/>

        <g>
          <rect x="132" y="40" width="1036" height="220" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="148" y="48" width="96" height="20" rx="4" fill="#f5f5f5"/>
          <text x="196" y="64" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">稳定前缀 · 适合缓存</text>
        </g>

        <g>
          <rect x="132" y="280" width="1036" height="244" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="148" y="288" width="96" height="20" rx="4" fill="#f5f5f5"/>
          <text x="196" y="304" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">易变上下文 · 每轮更新</text>
        </g>

        <g>
          <rect x="160" y="72" width="960" height="72" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <text x="180" y="112" fill="#eb6c36"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">01</text>
          <text x="276" y="112" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">身份与行为边界</text>
          <text x="1100" y="112" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">SOUL · 系统规则</text>
        </g>

        <g>
          <rect x="160" y="152" width="960" height="72" rx="8" fill="rgba(45,49,66,0.025)"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="180" y="192" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">02</text>
          <text x="276" y="192" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">工具规范</text>
          <text x="1100" y="192" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">核心 Schema · 使用约束</text>
        </g>

        <g>
          <rect x="160" y="296" width="960" height="64" rx="8" fill="rgba(45,49,66,0.025)"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="180" y="332" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">03</text>
          <text x="276" y="332" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">整理记忆</text>
          <text x="1100" y="332" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">MEMORY · USER 快照</text>
        </g>

        <g>
          <rect x="160" y="368" width="960" height="64" rx="8" fill="#ffffff"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="180" y="404" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">04</text>
          <text x="276" y="404" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">Skills 索引</text>
          <text x="1100" y="404" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">name + description</text>
        </g>

        <g>
          <rect x="160" y="440" width="960" height="64" rx="8" fill="rgba(45,49,66,0.025)"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="180" y="476" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">05</text>
          <text x="276" y="476" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">项目与会话上下文</text>
          <text x="1100" y="476" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">project · time · session</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
