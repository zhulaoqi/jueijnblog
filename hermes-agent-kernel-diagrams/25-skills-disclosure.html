<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skills 渐进式披露</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Flowchart · Skills</p>
    <h1>Skills 渐进式披露</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="skills-disclosure-title skills-disclosure-desc">
        <title id="skills-disclosure-title">Skills 渐进式披露</title>
        <desc id="skills-disclosure-desc">系统 Prompt 只暴露 Skills 索引，模型判断相关后才读取完整内容，并可在执行后管理 Skill。</desc>

      <defs>
        <marker id="skills-disclosure-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="skills-disclosure-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="skills-disclosure-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="480" fill="#f5f5f5"/>
<path d="M 240,268 L 320,268" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#skills-disclosure-arrow)"/>
<path d="M 380,208 L 380,144 Q 380,136 388,136 L 560,136" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#skills-disclosure-arrow)"/>
<path d="M 380,328 L 380,380" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#skills-disclosure-arrow)"/>
<path d="M 760,136 L 840,136" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#skills-disclosure-arrow)"/>
<path d="M 960,176 L 960,320" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#skills-disclosure-arrow)"/>
        <g>
          <rect x="476" y="112" width="48" height="16" rx="4" fill="#f5f5f5"/>
          <text x="500" y="124" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="middle"
                letter-spacing=".04em">相关</text>
        </g>
        <g>
          <rect x="388" y="336" width="48" height="16" rx="4" fill="#f5f5f5"/>
          <text x="396" y="348" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="start"
                letter-spacing=".04em">不相关</text>
        </g>
        <g>
          <rect x="40" y="220" width="200" height="96" rx="8" fill="#f5f5f5"/>
          <rect x="40" y="220" width="200" height="96" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="52" y="228" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="76" y="236" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">INDEX</text>
          <text x="140" y="276" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="140" dy="0">Skills 索引</tspan></text>
          <text x="140" y="296" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="140" dy="0">name + description</tspan></text>
        </g>

        <g>
          <polygon points="380,208 440,268 380,328 320,268" fill="#ffffff"
                   stroke="#2d3142" stroke-width="1.2"/>
          <text x="380" y="272" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif" text-anchor="middle">任务相关？</text>
        </g>

        <g>
          <rect x="560" y="96" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="560" y="96" width="200" height="80" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="572" y="104" width="40" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="592" y="112" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">VIEW</text>
          <text x="660" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="660" dy="0">skill_view</tspan></text>
          <text x="660" y="164" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="660" dy="0">加载完整 SKILL.md</tspan></text>
        </g>

        <g>
          <rect x="840" y="96" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="840" y="96" width="240" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="852" y="104" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="876" y="112" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">APPLY</text>
          <text x="960" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="960" dy="0">按 Skill 执行</tspan></text>
          <text x="960" y="164" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="960" dy="0">程序性上下文</tspan></text>
        </g>

        <g>
          <rect x="280" y="380" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="280" y="380" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="292" y="388" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="312" y="396" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">END</text>
          <text x="380" y="428" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="380" dy="0">跳过加载</tspan></text>
          <text x="380" y="448" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="380" dy="0">保持上下文精简</tspan></text>
        </g>

        <g>
          <rect x="840" y="320" width="240" height="96" rx="8" fill="#f5f5f5"/>
          <rect x="840" y="320" width="240" height="96" rx="8" fill="rgba(45,49,66,0.05)"
                stroke="#4f5d75" stroke-width="1.2"/>
          <rect x="852" y="328" width="64" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="884" y="336" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">MAINTAIN</text>
          <text x="960" y="368" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="960" dy="0">skill_manage</tspan></text>
          <text x="960" y="388" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="960" dy="0">完成后沉淀</tspan><tspan x="960" dy="16">创建 · Patch · 归档</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
