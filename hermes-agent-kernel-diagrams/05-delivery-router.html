<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>出站投递总线</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data Flow · Gateway</p>
    <h1>出站投递总线</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="delivery-router-title delivery-router-desc">
        <title id="delivery-router-title">出站投递总线</title>
        <desc id="delivery-router-desc">Delivery Router 将统一 Agent 输出独立路由到当前会话、IM 线程、后台任务或外部目标。</desc>

      <defs>
        <marker id="delivery-router-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="delivery-router-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="delivery-router-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="520" fill="#f5f5f5"/>
<path d="M 600,128 L 600,200" fill="none" stroke="#eb6c36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#delivery-router-arrow-accent)"/>
<path d="M 508,292 L 508,332 Q 508,340 500,340 L 188,340 Q 180,340 180,348 L 180,400" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#delivery-router-arrow)"/>
<path d="M 568,292 L 568,348 Q 568,356 560,356 L 468,356 Q 460,356 460,364 L 460,400" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#delivery-router-arrow)"/>
<path d="M 632,292 L 632,348 Q 632,356 640,356 L 732,356 Q 740,356 740,364 L 740,400" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#delivery-router-arrow)"/>
<path d="M 692,292 L 692,332 Q 692,340 700,340 L 1012,340 Q 1020,340 1020,348 L 1020,400" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#delivery-router-arrow)"/>
        <g>
          <rect x="460" y="48" width="280" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="460" y="48" width="280" height="80" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="472" y="56" width="48" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="496" y="64" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">OUTPUT</text>
          <text x="600" y="96" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="600" dy="0">AIAgent 输出</tspan></text>
          <text x="600" y="116" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="600" dy="0">text · artifact · event</tspan></text>
        </g>

        <g>
          <rect x="420" y="200" width="360" height="92" rx="8" fill="#f5f5f5"/>
          <rect x="420" y="200" width="360" height="92" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="432" y="208" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="456" y="216" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">ROUTER</text>
          <text x="600" y="252" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="600" dy="0">Delivery Router</tspan></text>
          <text x="600" y="272" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="600" dy="0">解析 delivery_target</tspan></text>
        </g>

        <g>
          <rect x="60" y="400" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="60" y="400" width="240" height="76" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="72" y="408" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="96" y="416" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">ORIGIN</text>
          <text x="180" y="444" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="180" dy="0">当前会话</tspan></text>
          <text x="180" y="464" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="180" dy="0">origin chat</tspan></text>
        </g>

        <g>
          <rect x="340" y="400" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="340" y="400" width="240" height="76" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="352" y="408" width="64" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="384" y="416" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">CHANNEL</text>
          <text x="460" y="444" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="460" dy="0">IM / Thread</tspan></text>
          <text x="460" y="464" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="460" dy="0">指定 channel</tspan></text>
        </g>

        <g>
          <rect x="620" y="400" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="620" y="400" width="240" height="76" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="632" y="408" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="656" y="416" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">ASYNC</text>
          <text x="740" y="444" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="740" dy="0">Cron / 后台任务</tspan></text>
          <text x="740" y="464" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="740" dy="0">不污染聊天历史</tspan></text>
        </g>

        <g>
          <rect x="900" y="400" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="900" y="400" width="240" height="76" rx="8" fill="rgba(79,93,117,0.08)"
                stroke="#7a8399" stroke-width="1.2"/>
          <rect x="912" y="408" width="40" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="932" y="416" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">SINK</text>
          <text x="1020" y="444" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1020" dy="0">Email / Local</tspan></text>
          <text x="1020" y="464" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1020" dy="0">外部投递</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
