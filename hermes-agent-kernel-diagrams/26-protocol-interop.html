<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>协议互操作全景</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Protocols</p>
    <h1>协议互操作全景</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="protocol-interop-title protocol-interop-desc">
        <title id="protocol-interop-title">协议互操作全景</title>
        <desc id="protocol-interop-desc">当前 AIAgent Runtime 通过 ACP、HTTP/SSE 和 MCP 连接 IDE、应用与工具；A2A 连接远程 Agent 属演进方向。</desc>

      <defs>
        <marker id="protocol-interop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="protocol-interop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="protocol-interop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="520" fill="#f5f5f5"/>
<path d="M 480,252 L 368,252 Q 360,252 360,244 L 360,144 Q 360,136 352,136 L 288,136" fill="none" stroke="#2e5aa8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#protocol-interop-arrow-link)"/>

<path d="M 720,300 L 832,300 Q 840,300 840,308 L 840,412 Q 840,420 848,420 L 912,420" fill="none" stroke="#2e5aa8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#protocol-interop-arrow-link)"/>
        <g>
          <rect x="368" y="204" width="48" height="16" rx="4" fill="#f5f5f5"/>
          <text x="376" y="216" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="start"
                letter-spacing=".04em">ACP</text>
        </g>

        <g>
          <rect x="368" y="372" width="80" height="16" rx="4" fill="#f5f5f5"/>
          <text x="376" y="384" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="start"
                letter-spacing=".04em">HTTP / SSE</text>
        </g>

        <g>
          <rect x="784" y="204" width="48" height="16" rx="4" fill="#f5f5f5"/>
          <text x="824" y="216" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end"
                letter-spacing=".04em">MCP</text>
        </g>

        <g>
          <rect x="752" y="372" width="80" height="16" rx="4" fill="#f5f5f5"/>
          <text x="824" y="384" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end"

                stroke="#eb6c36" stroke-width="1.2"/>

                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>

                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">CORE</text>
          <text x="600" y="284" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="600" dy="0">AIAgent Runtime</tspan></text>
          <text x="600" y="304" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="600" dy="0">统一内部 API</tspan></text>
        </g>

        <g>
          <rect x="48" y="96" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="48" y="96" width="240" height="80" rx="8" fill="rgba(79,93,117,0.08)"
                stroke="#7a8399" stroke-width="1.2"/>
          <rect x="60" y="104" width="40" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="80" y="112" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">IDE</text>
          <text x="168" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="168" dy="0">IDE / Editor</tspan></text>
          <text x="168" y="164" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="168" dy="0">驱动 Agent</tspan></text>
        </g>

        <g>
          <rect x="48" y="380" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="48" y="380" width="240" height="80" rx="8" fill="rgba(79,93,117,0.08)"
                stroke="#7a8399" stroke-width="1.2"/>
          <rect x="60" y="388" width="40" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="80" y="396" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">APP</text>
          <text x="168" y="428" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="168" dy="0">Web / CI / SDK</tspan></text>
          <text x="168" y="448" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="168" dy="0">嵌入服务</tspan></text>
        </g>

        <g>
          <rect x="912" y="96" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="912" y="96" width="240" height="80" rx="8" fill="rgba(79,93,117,0.08)"
                stroke="#7a8399" stroke-width="1.2"/>
          <rect x="924" y="104" width="40" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="944" y="112" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">TOOL</text>
          <text x="1032" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1032" dy="0">Tool / Resource</tspan></text>
          <text x="1032" y="164" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1032" dy="0">外部能力</tspan></text>
        </g>

        <g>
          <rect x="912" y="380" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="912" y="380" width="240" height="80" rx="8" fill="rgba(45,49,66,0.02)"
                stroke="rgba(45,49,66,0.30)" stroke-width="1.2" stroke-dasharray="4,4"/>
          <rect x="924" y="388" width="48" height="12" rx="4"
                fill="transparent" stroke="#7a8399" stroke-opacity=".48" stroke-width=".8"/>
          <text x="948" y="396" fill="#7a8399" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">FUTURE</text>
          <text x="1032" y="428" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1032" dy="0">Remote Agent</tspan></text>
          <text x="1032" y="448" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1032" dy="0">未来任务与 Artifact</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
