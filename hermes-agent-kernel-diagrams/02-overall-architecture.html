<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一个内核，多个入口</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Hermes</p>
    <h1>一个内核，多个入口</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="overall-architecture-title overall-architecture-desc">
        <title id="overall-architecture-title">一个内核，多个入口</title>
        <desc id="overall-architecture-desc">多个入口通过协议适配汇入同一个 AIAgent，并共享工具、Provider 与状态运行时。</desc>

      <defs>
        <marker id="overall-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="overall-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="overall-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="560" fill="#f5f5f5"/>

        <g>
          <rect x="40" y="40" width="1120" height="144" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="56" y="48" width="96" height="20" rx="4" fill="#f5f5f5"/>
          <text x="104" y="64" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">入口与适配</text>
        </g>
        <g>
          <rect x="40" y="220" width="1120" height="300" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="56" y="228" width="128" height="20" rx="4" fill="#f5f5f5"/>
          <text x="120" y="244" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">共享 AGENT RUNTIME</text>
        </g><path d="M 200,156 L 200,188 Q 200,196 208,196 L 508,196 Q 516,196 516,204 L 516,260" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#overall-architecture-arrow)"/>
<path d="M 520,156 L 520,204 Q 520,212 528,212 L 592,212 Q 600,212 600,220 L 600,260" fill="none" stroke="#eb6c36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#overall-architecture-arrow-accent)"/>
<path d="M 840,156 L 840,188 Q 840,196 832,196 L 692,196 Q 684,196 684,204 L 684,260" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#overall-architecture-arrow)"/>
<path d="M 516,352 L 516,372 Q 516,380 508,380 L 268,380 Q 260,380 260,388 L 260,420" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#overall-architecture-arrow)"/>
<path d="M 600,352 L 600,388 Q 600,396 592,396 L 588,396 Q 580,396 580,404 L 580,420" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#overall-architecture-arrow)"/>
<path d="M 684,352 L 684,372 Q 684,380 692,380 L 892,380 Q 900,380 900,388 L 900,420" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#overall-architecture-arrow)"/>
        <g>
          <rect x="80" y="76" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="80" y="76" width="240" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="92" y="84" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="116" y="92" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">ENTRY</text>
          <text x="200" y="124" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="200" dy="0">多端入口</tspan></text>
          <text x="200" y="144" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="200" dy="0">CLI · IM · IDE</tspan></text>
        </g>

        <g>
          <rect x="400" y="76" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="400" y="76" width="240" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="412" y="84" width="64" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="444" y="92" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">ADAPTER</text>
          <text x="520" y="124" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="520" dy="0">协议适配</tspan></text>
          <text x="520" y="144" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="520" dy="0">Gateway · ACP · API</tspan></text>
        </g>

        <g>
          <rect x="720" y="76" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="720" y="76" width="240" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="732" y="84" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="756" y="92" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">SCHED</text>
          <text x="840" y="124" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="840" dy="0">主动触发</tspan></text>
          <text x="840" y="144" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="840" dy="0">Cron · Background</tspan></text>
        </g>

        <g>
          <rect x="460" y="260" width="280" height="92" rx="8" fill="#f5f5f5"/>
          <rect x="460" y="260" width="280" height="92" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="472" y="268" width="40" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="492" y="276" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">CORE</text>
          <text x="600" y="312" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="600" dy="0">AIAgent</tspan></text>
          <text x="600" y="332" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="600" dy="0">推理 → 工具 → 反馈</tspan></text>
        </g>

        <g>
          <rect x="140" y="420" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="140" y="420" width="240" height="76" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="152" y="428" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="172" y="436" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">EXEC</text>
          <text x="260" y="464" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="260" dy="0">Tool / MCP</tspan></text>
          <text x="260" y="484" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="260" dy="0">真实世界副作用</tspan></text>
        </g>

        <g>
          <rect x="460" y="420" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="460" y="420" width="240" height="76" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="472" y="428" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="496" y="436" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">MODEL</text>
          <text x="580" y="464" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="580" dy="0">Provider Runtime</tspan></text>
          <text x="580" y="484" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="580" dy="0">厂商与 API 差异</tspan></text>
        </g>

        <g>
          <rect x="780" y="420" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="780" y="420" width="240" height="76" rx="8" fill="rgba(45,49,66,0.05)"
                stroke="#4f5d75" stroke-width="1.2"/>
          <rect x="792" y="428" width="48" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="816" y="436" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">STATE</text>
          <text x="900" y="464" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="900" dy="0">Session / Memory</tspan></text>
          <text x="900" y="484" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="900" dy="0">连续性与可恢复</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
