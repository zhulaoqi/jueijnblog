<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCP、ACP、A2A：三种协议解决三种边界</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Layer Stack · Protocols</p>
    <h1>MCP、ACP、A2A：三种协议解决三种边界</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="protocol-compare-title protocol-compare-desc">
        <title id="protocol-compare-title">MCP、ACP、A2A：三种协议解决三种边界</title>
        <desc id="protocol-compare-desc">MCP 面向工具调用，ACP 面向 IDE 驱动 Agent，A2A 面向远程 Agent 协作。</desc>

      <defs>
        <marker id="protocol-compare-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="protocol-compare-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="protocol-compare-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="520" fill="#f5f5f5"/>
<text x="100" y="60" fill="#4f5d75" font-size="12" font-family="'Geist Mono',monospace" text-anchor="start" letter-spacing=".06em">交互双方</text>
<text x="1100" y="60" fill="#4f5d75" font-size="12" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing=".06em">协议职责</text>

        <g>
          <rect x="100" y="88" width="1000" height="112" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <text x="120" y="148" fill="#eb6c36"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">MCP</text>
          <text x="216" y="148" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">Agent ↔ Tool</text>
          <text x="1080" y="148" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">发现并调用工具、资源与 Prompt</text>
        </g>

        <g>
          <rect x="100" y="216" width="1000" height="112" rx="8" fill="#ffffff"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="120" y="276" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">ACP</text>
          <text x="216" y="276" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">IDE ↔ Agent</text>
          <text x="1080" y="276" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">会话、流式进度、权限与取消</text>
        </g>

        <g>
          <rect x="100" y="344" width="1000" height="112" rx="8" fill="#ffffff"
                stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="120" y="404" fill="#4f5d75"
                font-size="12" font-weight="600" font-family="'Geist Mono',monospace">A2A</text>
          <text x="216" y="404" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">Agent ↔ Agent</text>
          <text x="1080" y="404" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="end">任务、消息、Artifact 与远程协作</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
