<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terminal 隔离不等于整个 Agent 隔离</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Security</p>
    <h1>Terminal 隔离不等于整个 Agent 隔离</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 528" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="security-sandbox-title security-sandbox-desc">
        <title id="security-sandbox-title">Terminal 隔离不等于整个 Agent 隔离</title>
        <desc id="security-sandbox-desc">只隔离 Terminal 仍让 MCP、Plugin 和凭据留在宿主；更强边界是隔离完整 Hermes 进程树。</desc>

      <defs>
        <marker id="security-sandbox-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="security-sandbox-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="security-sandbox-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="528" fill="#f5f5f5"/>

        <g>
          <rect x="32" y="48" width="532" height="436" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="48" y="56" width="192" height="20" rx="4" fill="#f5f5f5"/>
          <text x="144" y="72" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">TERMINAL-ONLY ISOLATION</text>
        </g>
        <g>
          <rect x="588" y="48" width="580" height="436" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="604" y="56" width="176" height="20" rx="4" fill="#f5f5f5"/>
          <text x="692" y="72" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">WHOLE-PROCESS SANDBOX</text>
        </g><path d="M 160,164 L 160,236" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#security-sandbox-arrow)"/>
<path d="M 284,304 L 380,304" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#security-sandbox-arrow)"/>
<path d="M 720,164 L 720,236" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#security-sandbox-arrow)"/>
<path d="M 844,304 L 940,304" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#security-sandbox-arrow)"/>
        <g>
          <rect x="72" y="96" width="176" height="68" rx="8" fill="#f5f5f5"/>
          <rect x="72" y="96" width="176" height="68" rx="8" fill="rgba(79,93,117,0.08)"
                stroke="#7a8399" stroke-width="1.2"/>
          <rect x="84" y="104" width="48" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="108" y="112" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">INPUT</text>
          <text x="160" y="136" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="160" dy="0">不可信输入</tspan></text>
          <text x="160" y="156" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="160" dy="0">web · mail · MCP</tspan></text>
        </g>

        <g>
          <rect x="72" y="236" width="212" height="136" rx="8" fill="#f5f5f5"/>
          <rect x="72" y="236" width="212" height="136" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="84" y="244" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="104" y="252" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">HOST</text>
          <text x="176" y="304" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="176" dy="0">Hermes Host</tspan></text>
          <text x="176" y="324" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="176" dy="0">凭据 · Plugin</tspan><tspan x="176" dy="16">MCP · Code Exec</tspan></text>
        </g>

        <g>
          <rect x="380" y="256" width="152" height="96" rx="8" fill="#f5f5f5"/>
          <rect x="380" y="256" width="152" height="96" rx="8" fill="rgba(45,49,66,0.02)"
                stroke="rgba(45,49,66,0.30)" stroke-width="1.2" stroke-dasharray="4,4"/>
          <rect x="392" y="264" width="48" height="12" rx="4"
                fill="transparent" stroke="#7a8399" stroke-opacity=".48" stroke-width=".8"/>
          <text x="416" y="272" fill="#7a8399" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">DOCKER</text>
          <text x="456" y="312" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="456" dy="0">Terminal</tspan></text>
          <text x="456" y="332" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="456" dy="0">仅命令隔离</tspan></text>
        </g>

        <g>
          <rect x="632" y="96" width="176" height="68" rx="8" fill="#f5f5f5"/>
          <rect x="632" y="96" width="176" height="68" rx="8" fill="rgba(79,93,117,0.08)"
                stroke="#7a8399" stroke-width="1.2"/>
          <rect x="644" y="104" width="48" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="668" y="112" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">INPUT</text>
          <text x="720" y="136" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="720" dy="0">不可信输入</tspan></text>
          <text x="720" y="156" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="720" dy="0">same threat</tspan></text>
        </g>

        <g>
          <rect x="632" y="236" width="212" height="136" rx="8" fill="#f5f5f5"/>
          <rect x="632" y="236" width="212" height="136" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="644" y="244" width="64" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="676" y="252" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">SANDBOX</text>
          <text x="736" y="304" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="736" dy="0">Hermes 进程树</tspan></text>
          <text x="736" y="324" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="736" dy="0">Agent · MCP</tspan><tspan x="736" dy="16">Plugin · Terminal</tspan></text>
        </g>

        <g>
          <rect x="940" y="256" width="196" height="96" rx="8" fill="#f5f5f5"/>
          <rect x="940" y="256" width="196" height="96" rx="8" fill="rgba(235,108,54,0.05)"
                stroke="rgba(235,108,54,0.55)" stroke-width="1.2" stroke-dasharray="4,4"/>
          <rect x="952" y="264" width="64" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="984" y="272" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">BOUNDARY</text>
          <text x="1040" y="312" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1040" dy="0">OS 隔离边界</tspan></text>
          <text x="1040" y="332" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1040" dy="0">Container / VM</tspan></text>
        </g><text x="296" y="404" fill="#4f5d75" font-size="12" font-family="'Geist Mono',monospace" text-anchor="start" letter-spacing=".06em">宿主扩展仍暴露</text><text x="884" y="404" fill="#4f5d75" font-size="12" font-family="'Geist Mono',monospace" text-anchor="start" letter-spacing=".06em">完整进程树受限</text>
      </svg>
    </div>
  </main>
</body>
</html>
