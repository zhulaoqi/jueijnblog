<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>四阶段上下文压缩算法</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Process · Context</p>
    <h1>四阶段上下文压缩算法</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="compression-phases-title compression-phases-desc">
        <title id="compression-phases-title">四阶段上下文压缩算法</title>
        <desc id="compression-phases-desc">压缩依次执行旧输出清理、保留边界确定、结构化摘要和消息合法性重组。</desc>

      <defs>
        <marker id="compression-phases-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="compression-phases-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="compression-phases-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="440" fill="#f5f5f5"/>
<path d="M 280,276 L 328,276" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compression-phases-arrow)"/>
<path d="M 560,276 L 608,276" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compression-phases-arrow)"/>
<path d="M 840,276 L 888,276" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compression-phases-arrow)"/>
        <g>
          <rect x="48" y="80" width="32" height="24" rx="8" fill="rgba(45,49,66,0.08)"/>
          <text x="64" y="96" fill="#4f5d75" font-size="12" font-weight="600"
                font-family="'Geist Mono',monospace" text-anchor="middle">1</text>
          <text x="92" y="100" fill="#4f5d75" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">机械清理</text>
        </g>

        <g>
          <rect x="328" y="80" width="32" height="24" rx="8" fill="rgba(45,49,66,0.08)"/>
          <text x="344" y="96" fill="#4f5d75" font-size="12" font-weight="600"
                font-family="'Geist Mono',monospace" text-anchor="middle">2</text>
          <text x="372" y="100" fill="#4f5d75" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">确定边界</text>
        </g>

        <g>
          <rect x="608" y="80" width="32" height="24" rx="8" fill="rgba(45,49,66,0.08)"/>
          <text x="624" y="96" fill="#4f5d75" font-size="12" font-weight="600"
                font-family="'Geist Mono',monospace" text-anchor="middle">3</text>
          <text x="652" y="100" fill="#4f5d75" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">结构摘要</text>
        </g>

        <g>
          <rect x="888" y="80" width="32" height="24" rx="8" fill="rgba(45,49,66,0.08)"/>
          <text x="904" y="96" fill="#4f5d75" font-size="12" font-weight="600"
                font-family="'Geist Mono',monospace" text-anchor="middle">4</text>
          <text x="932" y="100" fill="#4f5d75" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif">重组修复</text>
        </g>

        <g>
          <rect x="48" y="180" width="232" height="192" rx="8" fill="#f5f5f5"/>
          <rect x="48" y="180" width="232" height="192" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="60" y="188" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="84" y="196" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">CLEAN</text>
          <text x="164" y="276" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="164" dy="0">旧工具输出</tspan></text>
          <text x="164" y="296" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="164" dy="0">保护区外替换</tspan><tspan x="164" dy="16">可重新获取优先</tspan></text>
        </g>

        <g>
          <rect x="328" y="180" width="232" height="192" rx="8" fill="#f5f5f5"/>
          <rect x="328" y="180" width="232" height="192" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="340" y="188" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="364" y="196" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">BOUND</text>
          <text x="444" y="276" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="444" dy="0">三段边界</tspan></text>
          <text x="444" y="296" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="444" dy="0">固定头部 · 摘要中段</tspan><tspan x="444" dy="16">逐字尾部 · 调用成组</tspan></text>
        </g>

        <g>
          <rect x="608" y="180" width="232" height="192" rx="8" fill="#f5f5f5"/>
          <rect x="608" y="180" width="232" height="192" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="620" y="188" width="64" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="652" y="196" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">SUMMARY</text>
          <text x="724" y="276" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="724" dy="0">状态移交单</tspan></text>
          <text x="724" y="296" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="724" dy="0">Goal · Progress</tspan><tspan x="724" dy="16">Decisions · Next Steps</tspan></text>
        </g>

        <g>
          <rect x="888" y="180" width="232" height="192" rx="8" fill="#f5f5f5"/>
          <rect x="888" y="180" width="232" height="192" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="900" y="188" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="924" y="196" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">REPAIR</text>
          <text x="1004" y="276" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1004" dy="0">合法消息序列</tspan></text>
          <text x="1004" y="296" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1004" dy="0">保留头尾 · 插入摘要</tspan><tspan x="1004" dy="16">修复孤立 Tool Result</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
