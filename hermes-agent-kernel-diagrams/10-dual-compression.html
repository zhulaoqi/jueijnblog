<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>双层上下文压缩</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Flowchart · Context</p>
    <h1>双层上下文压缩</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 524" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="dual-compression-title dual-compression-desc">
        <title id="dual-compression-title">双层上下文压缩</title>
        <desc id="dual-compression-desc">Gateway 以 85% 阈值兜底异常长会话，AIAgent 以 50% 阈值主动压缩并为后续执行留出空间。</desc>

      <defs>
        <marker id="dual-compression-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="dual-compression-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="dual-compression-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="524" fill="#f5f5f5"/>

        <g>
          <rect x="32" y="48" width="488" height="432" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="48" y="56" width="192" height="20" rx="4" fill="#f5f5f5"/>
          <text x="144" y="72" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">GATEWAY SESSION HYGIENE</text>
        </g>
        <g>
          <rect x="544" y="48" width="624" height="432" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="560" y="56" width="176" height="20" rx="4" fill="#f5f5f5"/>
          <text x="648" y="72" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">AIAGENT ACTIVE CONTEXT</text>
        </g><path d="M 208,268 L 240,268" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dual-compression-arrow)"/>
<path d="M 300,208 L 300,144 Q 300,136 308,136 L 384,136" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dual-compression-arrow)"/>
<path d="M 484,176 L 484,224 Q 484,232 492,232 L 576,232" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dual-compression-arrow)"/>
<path d="M 360,268 L 540,268" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dual-compression-arrow)"/>
<path d="M 600,208 L 600,144 Q 600,136 608,136 L 760,136" fill="none" stroke="#eb6c36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dual-compression-arrow-accent)"/>
<path d="M 1000,136 L 1032,136 Q 1040,136 1040,144 L 1040,228" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dual-compression-arrow)"/>
<path d="M 660,268 L 920,268" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dual-compression-arrow)"/>
        <g>
          <rect x="308" y="168" width="48" height="16" rx="4" fill="#f5f5f5"/>
          <text x="316" y="180" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="start"
                letter-spacing=".04em">&gt;85%</text>
        </g>

        <g>
          <rect x="424" y="244" width="48" height="16" rx="4" fill="#f5f5f5"/>
          <text x="448" y="256" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="middle"
                letter-spacing=".04em">≤85%</text>
        </g>

        <g>
          <rect x="656" y="112" width="48" height="16" rx="4" fill="#f5f5f5"/>
          <text x="680" y="124" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="middle"
                letter-spacing=".04em">&gt;50%</text>
        </g>

        <g>
          <rect x="768" y="244" width="48" height="16" rx="4" fill="#f5f5f5"/>
          <text x="792" y="256" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="middle"
                letter-spacing=".04em">≤50%</text>
        </g>
        <g>
          <rect x="48" y="228" width="160" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="48" y="228" width="160" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="60" y="236" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="80" y="244" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">IN</text>
          <text x="128" y="276" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="128" dy="0">入站消息</tspan></text>
          <text x="128" y="296" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="128" dy="0">跨轮会话</tspan></text>
        </g>

        <g>
          <polygon points="300,208 360,268 300,328 240,268" fill="#ffffff"
                   stroke="#2d3142" stroke-width="1.2"/>
          <text x="300" y="272" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif" text-anchor="middle">超过 85%？</text>
        </g>

        <g>
          <rect x="384" y="96" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="384" y="96" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="396" y="104" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="420" y="112" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">SAFETY</text>
          <text x="484" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="484" dy="0">Gateway 清理</tspan></text>
          <text x="484" y="164" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="484" dy="0">会话安全网</tspan></text>
        </g>

        <g>
          <polygon points="600,208 660,268 600,328 540,268" fill="#ffffff"
                   stroke="#2d3142" stroke-width="1.2"/>
          <text x="600" y="272" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif" text-anchor="middle">超过 50%？</text>
        </g>

        <g>
          <rect x="760" y="96" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="760" y="96" width="240" height="80" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="772" y="104" width="64" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="804" y="112" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">COMPRESS</text>
          <text x="880" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="880" dy="0">ContextCompressor</tspan></text>
          <text x="880" y="164" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="880" dy="0">主动压缩</tspan></text>
        </g>

        <g>
          <rect x="920" y="228" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="920" y="228" width="240" height="80" rx="8" fill="rgba(45,49,66,0.05)"
                stroke="#4f5d75" stroke-width="1.2"/>
          <rect x="932" y="236" width="48" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="956" y="244" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">MODEL</text>
          <text x="1040" y="276" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1040" dy="0">进入模型</tspan></text>
          <text x="1040" y="296" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1040" dy="0">保留执行余量</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
