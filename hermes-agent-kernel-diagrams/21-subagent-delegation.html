<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>子 Agent 委派：隔离执行，摘要回传</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Tree · Delegation</p>
    <h1>子 Agent 委派：隔离执行，摘要回传</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 552" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="subagent-delegation-title subagent-delegation-desc">
        <title id="subagent-delegation-title">子 Agent 委派：隔离执行，摘要回传</title>
        <desc id="subagent-delegation-desc">Parent Agent 将目标分发给三个隔离 Worker，并仅把各自最终摘要汇入父上下文。</desc>

      <defs>
        <marker id="subagent-delegation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="subagent-delegation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="subagent-delegation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="552" fill="#f5f5f5"/>
<path d="M 600,136 L 600,188" fill="none" stroke="#eb6c36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 180,188 H 1020" fill="none" stroke="#4f5d75" stroke-width="1.4"/>
<path d="M 180,188 L 180,232" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#subagent-delegation-arrow)"/>
<path d="M 600,188 L 600,232" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#subagent-delegation-arrow)"/>
<path d="M 1020,188 L 1020,232" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#subagent-delegation-arrow)"/>
<path d="M 180,320 L 180,360 Q 180,368 188,368 L 512,368 Q 520,368 520,376 L 520,420" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#subagent-delegation-arrow)"/>
<path d="M 600,320 L 600,420" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#subagent-delegation-arrow)"/>
<path d="M 1020,320 L 1020,360 Q 1020,368 1012,368 L 688,368 Q 680,368 680,376 L 680,420" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#subagent-delegation-arrow)"/>
        <g>
          <rect x="480" y="48" width="240" height="88" rx="8" fill="#f5f5f5"/>
          <rect x="480" y="48" width="240" height="88" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="492" y="56" width="48" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="516" y="64" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">PARENT</text>
          <text x="600" y="100" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="600" dy="0">Parent Agent</tspan></text>
          <text x="600" y="120" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="600" dy="0">goal + bounded context</tspan></text>
        </g>

        <g>
          <rect x="60" y="232" width="240" height="88" rx="8" fill="#f5f5f5"/>
          <rect x="60" y="232" width="240" height="88" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="72" y="240" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="96" y="248" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">WORKER</text>
          <text x="180" y="284" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="180" dy="0">研究文档</tspan></text>
          <text x="180" y="304" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="180" dy="0">独立 Context</tspan></text>
        </g>

        <g>
          <rect x="480" y="232" width="240" height="88" rx="8" fill="#f5f5f5"/>
          <rect x="480" y="232" width="240" height="88" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="492" y="240" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="516" y="248" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">WORKER</text>
          <text x="600" y="284" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="600" dy="0">检查代码</tspan></text>
          <text x="600" y="304" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="600" dy="0">独立 Terminal</tspan></text>
        </g>

        <g>
          <rect x="900" y="232" width="240" height="88" rx="8" fill="#f5f5f5"/>
          <rect x="900" y="232" width="240" height="88" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="912" y="240" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="936" y="248" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">WORKER</text>
          <text x="1020" y="284" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1020" dy="0">运行测试</tspan></text>
          <text x="1020" y="304" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1020" dy="0">收窄工具权限</tspan></text>
        </g>

        <g>
          <rect x="480" y="420" width="240" height="88" rx="8" fill="#f5f5f5"/>
          <rect x="480" y="420" width="240" height="88" rx="8" fill="rgba(45,49,66,0.05)"
                stroke="#4f5d75" stroke-width="1.2"/>
          <rect x="492" y="428" width="48" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="516" y="436" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">MERGE</text>
          <text x="600" y="472" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="600" dy="0">Summary Merge</tspan></text>
          <text x="600" y="492" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="600" dy="0">只回传最终摘要</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
