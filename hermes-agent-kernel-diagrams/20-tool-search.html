<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tool Search：Schema 发现与工具执行分流</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Process · Tools</p>
    <h1>Tool Search：Schema 发现与工具执行分流</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="tool-search-title tool-search-desc">
        <title id="tool-search-title">Tool Search：Schema 发现与工具执行分流</title>
        <desc id="tool-search-desc">AIAgent 一条路径通过 search、describe 查询 Catalog Schema，另一条路径经 tool_call、Registry 与外部工具执行，并把 Tool Result 返回模型。</desc>

      <defs>
        <marker id="tool-search-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="tool-search-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="tool-search-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="560" fill="#f5f5f5"/>

        <g>
          <rect x="264" y="40" width="760" height="152" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="280" y="48" width="128" height="20" rx="4" fill="#f5f5f5"/>
          <text x="344" y="64" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">SCHEMA DISCOVERY</text>
        </g>
        <g>
          <rect x="264" y="328" width="912" height="152" rx="8" fill="rgba(45,49,66,0.03)"
                stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
          <rect x="280" y="336" width="112" height="20" rx="4" fill="#f5f5f5"/>
          <text x="336" y="352" fill="#4f5d75"
                font-size="12" font-weight="500" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".10em">TOOL EXECUTION</text>
        </g><path d="M 240,252 L 248,252 Q 256,252 256,244 L 256,136 Q 256,128 264,128 L 280,128" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-search-arrow)"/>
<path d="M 480,128 L 520,128" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-search-arrow)"/>
<path d="M 720,128 L 760,128" fill="none" stroke="#2e5aa8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-search-arrow-link)"/>
<path d="M 240,308 L 248,308 Q 256,308 256,316 L 256,392 Q 256,400 264,400 L 280,400" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-search-arrow)"/>
<path d="M 480,400 L 520,400" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-search-arrow)"/>
<path d="M 720,400 L 760,400" fill="none" stroke="#2e5aa8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-search-arrow-link)"/>
<path d="M 960,400 L 1000,400" fill="none" stroke="#2e5aa8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-search-arrow-link)"/>
<path d="M 1080,440 L 1080,496 Q 1080,504 1072,504 L 148,504 Q 140,504 140,496 L 140,336" fill="none" stroke="#2e5aa8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#tool-search-arrow-link)"/>
        <g>
          <rect x="40" y="224" width="200" height="112" rx="8" fill="#f5f5f5"/>
          <rect x="40" y="224" width="200" height="112" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="52" y="232" width="48" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="76" y="240" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">AGENT</text>
          <text x="140" y="288" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="140" dy="0">AIAgent / Model</tspan></text>
          <text x="140" y="308" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="140" dy="0">两条独立路径</tspan></text>
        </g>

        <g>
          <rect x="280" y="88" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="280" y="88" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="292" y="96" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="316" y="104" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">SEARCH</text>
          <text x="380" y="136" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="380" dy="0">tool_search</tspan></text>
          <text x="380" y="156" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="380" dy="0">按关键词发现</tspan></text>
        </g>

        <g>
          <rect x="520" y="88" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="520" y="88" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="532" y="96" width="64" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="564" y="104" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">DESCRIBE</text>
          <text x="620" y="136" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="620" dy="0">tool_describe</tspan></text>
          <text x="620" y="156" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="620" dy="0">按需读取 Schema</tspan></text>
        </g>

        <g>
          <rect x="760" y="88" width="240" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="760" y="88" width="240" height="80" rx="8" fill="rgba(45,49,66,0.05)"

          <rect x="772" y="96" width="64" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="804" y="104" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">CATALOG</text>
          <text x="880" y="136" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="880" dy="0">MCP / Plugin Catalog</tspan></text>
          <text x="880" y="156" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="880" dy="0">工具 Schema 索引</tspan></text>
        </g>

        <g>
          <rect x="280" y="360" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="280" y="360" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="292" y="368" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="312" y="376" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">CALL</text>
          <text x="380" y="408" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="380" dy="0">tool_call</tspan></text>
          <text x="380" y="428" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="380" dy="0">提交调用参数</tspan></text>
        </g>

        <g>
          <rect x="520" y="360" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="520" y="360" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="532" y="368" width="64" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="564" y="376" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">REGISTRY</text>
          <text x="620" y="408" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="620" dy="0">Tool Registry</tspan></text>
          <text x="620" y="428" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="620" dy="0">解析并分发</tspan></text>
        </g>

        <g>
          <rect x="760" y="360" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="760" y="360" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="772" y="368" width="64" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="804" y="376" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">EXTERNAL</text>
          <text x="860" y="408" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="860" dy="0">External Tool</tspan></text>
          <text x="860" y="428" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="860" dy="0">执行真实副作用</tspan></text>
        </g>

        <g>
          <rect x="1000" y="360" width="160" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="1000" y="360" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)"
                stroke="#4f5d75" stroke-width="1.2"/>
          <rect x="1012" y="368" width="48" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="1036" y="376" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">RESULT</text>
          <text x="1080" y="408" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1080" dy="0">Tool Result</tspan></text>
          <text x="1080" y="428" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1080" dy="0">返回模型上下文</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
