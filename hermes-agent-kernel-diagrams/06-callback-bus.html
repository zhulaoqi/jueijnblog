<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIAgent 回调事件总线</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Events</p>
    <h1>AIAgent 回调事件总线</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="callback-bus-title callback-bus-desc">
        <title id="callback-bus-title">AIAgent 回调事件总线</title>
        <desc id="callback-bus-desc">同一 AIAgent 回调流被 CLI、Gateway、ACP 和 TUI 宿主独立消费。</desc>

      <defs>
        <marker id="callback-bus-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="callback-bus-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="callback-bus-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="520" fill="#f5f5f5"/>
<path d="M 600,132 L 600,204" fill="none" stroke="#eb6c36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#callback-bus-arrow-accent)"/>
<path d="M 468,296 L 468,340 Q 468,348 460,348 L 188,348 Q 180,348 180,356 L 180,404" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#callback-bus-arrow)"/>
<path d="M 556,296 L 556,356 Q 556,364 548,364 L 468,364 Q 460,364 460,372 L 460,404" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#callback-bus-arrow)"/>
<path d="M 644,296 L 644,356 Q 644,364 652,364 L 732,364 Q 740,364 740,372 L 740,404" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#callback-bus-arrow)"/>
<path d="M 732,296 L 732,340 Q 732,348 740,348 L 1012,348 Q 1020,348 1020,356 L 1020,404" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#callback-bus-arrow)"/>
        <g>
          <rect x="440" y="48" width="320" height="84" rx="8" fill="#f5f5f5"/>
          <rect x="440" y="48" width="320" height="84" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="452" y="56" width="40" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="472" y="64" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">CORE</text>
          <text x="600" y="96" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="600" dy="0">AIAgent</tspan></text>
          <text x="600" y="116" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="600" dy="0">唯一执行事件源</tspan></text>
        </g>

        <g>
          <rect x="360" y="204" width="480" height="92" rx="8" fill="#f5f5f5"/>
          <rect x="360" y="204" width="480" height="92" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="372" y="212" width="64" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="404" y="220" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">CALLBACK</text>
          <text x="600" y="256" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="600" dy="0">Callback Event Stream</tspan></text>
          <text x="600" y="276" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="600" dy="0">tool · thinking · token · approval</tspan></text>
        </g>

        <g>
          <rect x="60" y="404" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="60" y="404" width="240" height="76" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="72" y="412" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="92" y="420" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">HOST</text>
          <text x="180" y="448" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="180" dy="0">CLI</tspan></text>
          <text x="180" y="468" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="180" dy="0">spinner · token</tspan></text>
        </g>

        <g>
          <rect x="340" y="404" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="340" y="404" width="240" height="76" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="352" y="412" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="372" y="420" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">HOST</text>
          <text x="460" y="448" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="460" dy="0">Gateway</tspan></text>
          <text x="460" y="468" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="460" dy="0">进度 · 审批</tspan></text>
        </g>

        <g>
          <rect x="620" y="404" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="620" y="404" width="240" height="76" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="632" y="412" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="652" y="420" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">HOST</text>
          <text x="740" y="448" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="740" dy="0">ACP / IDE</tspan></text>
          <text x="740" y="468" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="740" dy="0">session/update</tspan></text>
        </g>

        <g>
          <rect x="900" y="404" width="240" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="900" y="404" width="240" height="76" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="912" y="412" width="40" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="932" y="420" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">HOST</text>
          <text x="1020" y="448" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="1020" dy="0">TUI RPC</tspan></text>
          <text x="1020" y="468" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="1020" dy="0">tool.start</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
