<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工具调用分发链</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#f5f5f5;color:#2d3142}
body{font-family:'Geist',system-ui,sans-serif;padding:32px 20px}
.frame{width:min(1200px,100%);margin:0 auto}
.eyebrow{margin:0 0 8px;font:500 12px/1.3 'Geist Mono',monospace;
  letter-spacing:.16em;text-transform:uppercase;color:#4f5d75}
h1{margin:0 0 20px;font:400 32px/1.12 'Instrument Serif',serif;
  letter-spacing:-.02em}
.diagram-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:880px;height:auto}
@media(max-width:720px){body{padding:20px 12px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Flowchart · Tools</p>
    <h1>工具调用分发链</h1>
    <div class="diagram-scroll">
      <svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="tool-dispatch-title tool-dispatch-desc">
        <title id="tool-dispatch-title">工具调用分发链</title>
        <desc id="tool-dispatch-desc">模型调用意图经 AIAgent 校验后进入内核特判或 Registry 与 Hooks，执行结果再回灌消息历史。</desc>

      <defs>
        <marker id="tool-dispatch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="tool-dispatch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="tool-dispatch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
        <rect width="1200" height="520" fill="#f5f5f5"/>
<path d="M 232,148 L 320,148" fill="none" stroke="#eb6c36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-dispatch-arrow-accent)"/>
<path d="M 520,148 L 608,148" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-dispatch-arrow)"/>
<path d="M 708,196 L 708,248" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-dispatch-arrow)"/>
<path d="M 808,148 L 888,148" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-dispatch-arrow)"/>
<path d="M 808,296 L 888,296" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-dispatch-arrow)"/>
<path d="M 1088,148 L 1136,148 Q 1144,148 1144,156 L 1144,480 Q 1144,488 1136,488 L 590,488 Q 584,488 584,482 L 584,476" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-dispatch-arrow)"/>
<path d="M 988,336 L 988,368 Q 988,376 980,376 L 664,376 Q 656,376 656,384 L 656,400" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tool-dispatch-arrow)"/>
<path d="M 520,436 L 344,436 Q 336,436 336,428 L 336,188" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#tool-dispatch-arrow)"/>
        <g>
          <rect x="824" y="124" width="48" height="16" rx="4" fill="#f5f5f5"/>
          <text x="848" y="136" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="middle"
                letter-spacing=".04em">STATE</text>
        </g>
        <g>
          <rect x="816" y="272" width="64" height="16" rx="4" fill="#f5f5f5"/>
          <text x="848" y="284" fill="#4f5d75" font-size="12"
                font-family="'Geist Mono',monospace" text-anchor="middle"
                letter-spacing=".04em">REGISTRY</text>
        </g>
        <g>
          <rect x="48" y="108" width="184" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="48" y="108" width="184" height="80" rx="8" fill="rgba(235,108,54,0.08)"
                stroke="#eb6c36" stroke-width="1.2"/>
          <rect x="60" y="116" width="48" height="12" rx="4"
                fill="transparent" stroke="#eb6c36" stroke-opacity=".48" stroke-width=".8"/>
          <text x="84" y="124" fill="#eb6c36" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">MODEL</text>
          <text x="140" y="156" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="140" dy="0">tool_call</tspan></text>
          <text x="140" y="176" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="140" dy="0">name + arguments</tspan></text>
        </g>

        <g>
          <rect x="320" y="108" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="320" y="108" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="332" y="116" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="356" y="124" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">AGENT</text>
          <text x="420" y="156" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="420" dy="0">_invoke_tool</tspan></text>
          <text x="420" y="176" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="420" dy="0">校验与上下文</tspan></text>
        </g>

        <g>
          <polygon points="708,100 808,148 708,196 608,148" fill="#ffffff"
                   stroke="#2d3142" stroke-width="1.2"/>
          <text x="708" y="152" fill="#2d3142" font-size="16" font-weight="600"
                font-family="'Geist',sans-serif" text-anchor="middle">内核特判？</text>
        </g>

        <g>
          <rect x="608" y="248" width="200" height="96" rx="8" fill="#f5f5f5"/>
          <rect x="608" y="248" width="200" height="96" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="620" y="256" width="64" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="652" y="264" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">REGISTRY</text>
          <text x="708" y="304" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="708" dy="0">Registry + Hooks</tspan></text>
          <text x="708" y="324" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="708" dy="0">pre · dispatch · post</tspan></text>
        </g>

        <g>
          <rect x="888" y="108" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="888" y="108" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="900" y="116" width="48" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="924" y="124" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">STATE</text>
          <text x="988" y="156" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="988" dy="0">Agent-state Tool</tspan></text>
          <text x="988" y="176" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="988" dy="0">显式上下文</tspan></text>
        </g>

        <g>
          <rect x="888" y="256" width="200" height="80" rx="8" fill="#f5f5f5"/>
          <rect x="888" y="256" width="200" height="80" rx="8" fill="#ffffff"
                stroke="#2d3142" stroke-width="1.2"/>
          <rect x="900" y="264" width="64" height="12" rx="4"
                fill="transparent" stroke="#2d3142" stroke-opacity=".48" stroke-width=".8"/>
          <text x="932" y="272" fill="#2d3142" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">HANDLER</text>
          <text x="988" y="304" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="988" dy="0">Tool Handler</tspan></text>
          <text x="988" y="324" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="988" dy="0">执行副作用</tspan></text>
        </g>

        <g>
          <rect x="520" y="400" width="200" height="76" rx="8" fill="#f5f5f5"/>
          <rect x="520" y="400" width="200" height="76" rx="8" fill="rgba(45,49,66,0.05)"
                stroke="#4f5d75" stroke-width="1.2"/>
          <rect x="532" y="408" width="48" height="12" rx="4"
                fill="transparent" stroke="#4f5d75" stroke-opacity=".48" stroke-width=".8"/>
          <text x="556" y="416" fill="#4f5d75" font-size="8"
                font-weight="600" font-family="'Geist Mono',monospace"
                text-anchor="middle" letter-spacing=".08em">RESULT</text>
          <text x="620" y="444" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"><tspan x="620" dy="0">role=tool</tspan></text>
          <text x="620" y="464" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono',monospace" text-anchor="middle"><tspan x="620" dy="0">回灌 messages</tspan></text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
